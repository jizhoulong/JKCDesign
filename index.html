<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionGuard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif; background: #f2f2f7; color: #1c1c1e; -webkit-font-smoothing: antialiased; }

.app { display: flex; height: 100vh; }

/* ===== 左侧 Tab 栏（iOS 侧栏风格） ===== */
.tabbar { width: 290px; background: #1c1c1e; display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid #2c2c2e; }
.tabbar-header { padding: 24px 16px 10px; border-bottom: 1px solid #2c2c2e; }
.tabbar-header h3 { color: #ffffff; font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
.tabbar-header h3 span { font-size: 14px; font-weight: 400; color: #8e8e93; }
.tabbar-stats { display: none; padding: 4px 12px 6px; font-size: 11px; color: #636366; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid #2c2c2e; }
.tabbar-stats.show { display: flex; }
.tabbar-stats .stat-item { display: inline-flex; align-items: center; gap: 3px; }
.tabbar-stats .stat-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.tabbar-actions { padding: 6px 12px; border-bottom: 1px solid #2c2c2e; }
.btn-add-group { width: 100%; padding: 8px 12px; font-size: 13px; border: none; border-radius: 8px; background: #2c2c2e; color: #8e8e93; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .15s; font-weight: 500; }
.btn-add-group:hover { background: #3a3a3c; color: #c7c7cc; }
.tab-list { flex: 1; overflow-y: auto; padding: 6px 12px; }
.tab-list .tab-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 2px; user-select: none; transition: all .1s; }
.tab-list .tab-item:hover { background: #2c2c2e; }
.tab-list .tab-item.active { background: #3a3a3c; }
.tab-list .tab-item .tab-icon { font-size: 14px; flex-shrink: 0; width: 20px; text-align: center; }
.tab-list .tab-item .tab-name { font-size: 14px; color: #c7c7cc; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-list .tab-item.active .tab-name { color: #ffffff; font-weight: 600; }
.tab-list .tab-item .tab-actions { display: none; gap: 2px; flex-shrink: 0; }
.tab-list .tab-item:hover .tab-actions { display: flex; }
.tab-list .tab-item .tab-actions button { width: 20px; height: 20px; border: none; border-radius: 6px; background: transparent; color: #636366; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; padding: 0; transition: all .1s; }
.tab-list .tab-item .tab-actions button:hover { background: rgba(255,255,255,.08); color: #c7c7cc; }
.tab-list .tab-item .tab-actions .del-btn:hover { background: rgba(239,68,68,.15); color: #ef4444; }
.tab-list .tab-item .inline-edit { flex: 1; background: #1c1c1e; border: 1px solid #636366; border-radius: 6px; color: #ffffff; font-size: 14px; padding: 3px 8px; outline: none; min-width: 0; }
.tab-list .sub-page-wrap { padding-left: 14px; border-left: 1px solid #2c2c2e; margin-left: 4px; }

/* ===== 主内容 ===== */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #f2f2f7; }

/* ===== 上传栏（iOS 毛玻璃风格） ===== */
.upload-bar { display: flex; gap: 10px; align-items: center; padding: 10px 20px; background: rgba(255,255,255,.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: .5px solid #d1d1d6; flex-shrink: 0; flex-wrap: wrap; }
.upload-bar .file-label { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #f2f2f7; border: 1.5px solid #d1d1d6; border-radius: 10px; cursor: pointer; font-size: 13px; color: #3a3a3c; font-weight: 500; transition: all .15s; }
.upload-bar .file-label:hover { border-color: #0a84ff; background: #e8f0fe; }
.upload-bar .file-label.has-img { border-color: #30d158; background: #f0fdf4; }
.upload-bar .file-label input { display: none; }
.upload-bar .detect-btn { padding: 6px 16px; border-radius: 10px; border: none; background: #0a84ff; color: #fff; font-size: 13px; cursor: pointer; font-weight: 600; transition: all .15s; }
.upload-bar .detect-btn:hover { background: #0063ce; }
.upload-bar .detect-btn:disabled { opacity: .4; cursor: not-allowed; }
.upload-bar .status { font-size: 13px; color: #8e8e93; }

/* ===== 四列对比（圆角卡片） ===== */
.compare-4 { display: flex; height: 55%; min-height: 260px; gap: 8px; flex-shrink: 0; padding: 8px 12px 0; }
.compare-4 .cell { flex: 1; display: flex; align-items: center; justify-content: center; background: #fff; overflow: hidden; position: relative; border-radius: 12px; min-width: 0; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.compare-4 .cell:last-child { border-right: none; }
.compare-4 .cell:hover .cell-enlarge { opacity: 1; }
.compare-4 .cell .cell-enlarge { position: absolute; top: 6px; right: 8px; font-size: 14px; color: #fff; background: rgba(0,0,0,.45); width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s; z-index: 4; }
.compare-4 .cell .cell-enlarge:hover { background: rgba(0,0,0,.75); }
.compare-4 .cell .drop-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 100%; color: #aeaeb2; cursor: pointer; border-radius: 12px; }
.compare-4 .cell .drop-zone.dragover { background: #e8f0fe; }
.compare-4 .cell .drop-zone .dz-icon { font-size: 32px; }
.compare-4 .cell .drop-zone .dz-text { font-size: 12px; color: #aeaeb2; }
.compare-4 .cell .drop-zone input { display: none; }
.compare-4 .cell .cell-label { position: absolute; top: 6px; left: 10px; font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 6px; background: rgba(0,0,0,.5); color: #fff; z-index: 3; pointer-events: none; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

/* 图片填满 + 可放大 */
.compare-4 .cell .cell-img { width: 100%; height: 100%; object-fit: contain; }

/* 叠图层 */
.overlay-wrap { position: relative; width: 100%; height: 100%; border-radius: 12px; overflow: hidden; background: #fff; }
.overlay-wrap img { position: absolute; max-width: 100%; max-height: 100%; left: 50%; top: 50%; transform: translate(-50%,-50%); }
.overlay-wrap .overlay-bg { z-index: 1; }
.overlay-wrap .overlay-top { z-index: 2; }

.overlay-slider { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.55); border-radius: 10px; padding: 4px 12px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.overlay-slider input[type="range"] { width: 80px; height: 4px; -webkit-appearance: none; appearance: none; background: #636366; border-radius: 2px; outline: none; }
.overlay-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #0a84ff; cursor: pointer; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.overlay-slider .slider-val { font-size: 11px; color: #e5e5ea; min-width: 24px; text-align: center; }

/* ===== 带手柄的行号拖拽 ===== */
.resize-bar { position: relative; height: 20px; background: #f2f2f7; border-top: .5px solid #d1d1d6; border-bottom: .5px solid #d1d1d6; cursor: row-resize; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 6px; user-select: none; z-index: 5; }
.resize-bar:hover { background: #e5e5ea; }
.resize-bar .grip { display: flex; align-items: center; gap: 4px; color: #aeaeb2; font-size: 12px; pointer-events: none; }
.resize-bar .grip i { font-size: 12px; color: #aeaeb2; }
.resize-bar:active { background: #d1d1d6; }

/* ===== 下方问题汇总（iOS 面板） ===== */
.issue-panel { flex: 1; display: flex; flex-direction: column; background: #fff; border-top: .5px solid #d1d1d6; min-height: 0; border-radius: 0; }
.issue-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-bottom: .5px solid #d1d1d6; flex-shrink: 0; }
.issue-header h3 { font-size: 15px; font-weight: 700; }
.issue-header .stats { font-size: 13px; color: #8e8e93; }
.issue-list-wrap { overflow-y: auto; flex: 1; }

.issue-table { width: 100%; border-collapse: collapse; }
.issue-table th { position: sticky; top: 0; z-index: 1; background: #f9f9fb; padding: 8px 14px; font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; text-align: left; border-bottom: .5px solid #e5e5ea; letter-spacing: .5px; }
.issue-table td { padding: 8px 14px; font-size: 13px; border-bottom: .5px solid #f2f2f7; vertical-align: middle; }
.issue-table tr { cursor: pointer; }
.issue-table tr:hover { background: #f9f9fb; }
.issue-table tr.active { background: #e8f0fe; }
.issue-table .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
.tag-P0 { background: #fef2f2; color: #dc2626; }
.tag-P1 { background: #fff8e6; color: #d97706; }
.tag-P2 { background: #e8f0fe; color: #0a84ff; }
.issue-table .id-col { width: 36px; color: #aeaeb2; text-align: center; font-size: 12px; }
.issue-table .prio-col { width: 52px; }
.issue-table .type-col { width: 64px; color: #8e8e93; }
.issue-table .preview-img { width: 70px; height: 40px; object-fit: cover; border-radius: 6px; border: .5px solid #e5e5ea; cursor: pointer; transition: transform .1s; }
.issue-table .preview-img:hover { transform: scale(1.4); box-shadow: 0 4px 16px rgba(0,0,0,.12); }

.no-issues { display: flex; align-items: center; justify-content: center; flex: 1; color: #30d158; font-size: 15px; gap: 8px; }
.loading-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #aeaeb2; font-size: 14px; gap: 8px; }
.spinner { width: 20px; height: 20px; border: 2.5px solid #e5e5ea; border-top-color: #0a84ff; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Modal 放大 ===== */
.modal-overlay { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.85); cursor: zoom-out; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.modal-overlay.open { display: flex; align-items: center; justify-content: center; }
.modal-overlay img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 14px; box-shadow: 0 8px 40px rgba(0,0,0,.3); }

/* ===== iOS 风格滚动条 ===== */
.tabbar-version { text-align: center; padding: 6px 12px; font-size: 11px; color: rgba(255,255,255,0.6); flex-shrink: 0; }
.tabbar-footer { border-top: 1px solid #2c2c2e; padding: 6px 10px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.cloud-status { font-size: 10px; color: rgba(255,255,255,0.45); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cloud-status.ok { color: #30d158; }
.cloud-status.err { color: #ff453a; }
.cloud-status.syncing { color: #ff9f0a; }
.cloud-btn { font-size: 10px; padding: 3px 8px; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; background: transparent; color: rgba(255,255,255,0.6); cursor: pointer; white-space: nowrap; transition: all .1s; }
.cloud-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
.cloud-btn:active { background: rgba(255,255,255,0.15); }
.tab-list::-webkit-scrollbar,
.issue-list-wrap::-webkit-scrollbar,
.compare-4::-webkit-scrollbar { width: 4px; height: 4px; }
.tab-list::-webkit-scrollbar-track,
.issue-list-wrap::-webkit-scrollbar-track { background: transparent; }
.tab-list::-webkit-scrollbar-thumb,
.issue-list-wrap::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 2px; }
.issue-list-wrap::-webkit-scrollbar-thumb { background: #d1d1d6; }

/* ===== iOS 风格的表单 ===== */
input, select, textarea { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="tabbar">
    <div class="tabbar-header">
      <h3>JKC 设计走查<span> 小龙虾</span></h3>
    </div>
    <div class="tabbar-stats" id="tabbarStats"></div>
    <div class="tabbar-actions">
      <button class="btn-add-group" onclick="addTab('新板块',{isGroup:true})">📁 新增板块</button>
    </div>
    <div class="tab-list" id="tabList"></div>
    <div class="tabbar-version" id="versionLabel">v?</div>
    <div class="tabbar-footer">
      <span class="cloud-status" id="cloudStatus">☁️ --</span>
      <button class="cloud-btn" onclick="cloudifyPull()">📥 拉取</button>
      <button class="cloud-btn" onclick="cloudifyPush()">📤 推送</button>
    </div>
  </div>
  <div class="main" id="mainArea"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"><img id="modalImg"></div>

<script>
// ====================================================================
// VisionGuard Detection Engine v9 — 全内联
// ====================================================================

<script>
// ===== State =====
let tabIdCounter = 1;
let activeTabId = null;
const VERSION = '525v5-cloud';
const tabs = new Map();
const collapsedGroups = new Set(); // 存储已折叠的板块 ID

// ===== Tab Mgmt =====
function addTab(name, opts) {
  const id = 'tab_' + (tabIdCounter++);
  const isGroup = opts && opts.isGroup;
  tabs.set(id, {
    id,
    name: name || (isGroup ? '新板块 ' + (tabIdCounter-1) : '新 Tab ' + (tabIdCounter-1)),
    isGroup: !!isGroup,
    children: (opts && opts.children) || [],
    designImg: null, devImg: null, result: null, selectedIdx: -1, overlayOpacity: 0.5
  });
  renderTabList();
  activateTab(id);
}
function removeTab(id) {
  const tab = tabs.get(id);
  if (tabs.size <= 1 || !tab) return;
  if (tab.isGroup && tab.children.length > 0) {
    for (const cid of tab.children) tabs.delete(cid);
  }
  tabs.delete(id);
  if (activeTabId === id) activateTab(tabs.keys().next().value);
  renderTabList();
  autoSave();
}
function renameTab(id, n) { const t=tabs.get(id); if(t){t.name=n||t.name;renderTabList();} }
function removeDesignImg(id) { const t=tabs.get(id); if(!t)return; t.designImg=null; t.result=null; renderMain(id); }
function removeDevImg(id) { const t=tabs.get(id); if(!t)return; t.devImg=null; t.result=null; renderMain(id); }
function activateTab(id) { activeTabId=id; renderTabList(); renderMain(id); }
function addChildTab(groupId) {
  const g = tabs.get(groupId);
  if (!g) return;
  const cid = 'tab_' + (tabIdCounter++);
  tabs.set(cid, {
    id: cid, name: '子页面 ' + (tabIdCounter-1), isGroup: false, children: [],
    designImg: null, devImg: null, result: null, selectedIdx: -1, overlayOpacity: 0.5
  });
  g.children.push(cid);
  renderTabList();
  activateTab(cid);
}

function renderTabList() {
  const list = document.getElementById('tabList');
  list.innerHTML = '';
  const groups = [], leafTabs = [];
  const childrenSet = new Set();
  for (const [, t] of tabs) { if (t.isGroup) for (const cid of t.children) childrenSet.add(cid); }
  for (const [, tab] of tabs) {
    if (tab.isGroup) groups.push(tab);
    else if (!childrenSet.has(tab.id)) leafTabs.push(tab);
  }
  // 数据面板排到最前
  const dataPanelIdx = groups.findIndex(g => g.name === '数据面板');
  if (dataPanelIdx > 0) {
    const [dp] = groups.splice(dataPanelIdx, 1);
    groups.unshift(dp);
  }
  for (const g of groups) {
    const isCollapsed = collapsedGroups.has(g.id);
    appendTabItem(list, g, true, isCollapsed);
    const childWrap = document.createElement('div');
    childWrap.className = 'sub-page-wrap';
    if (isCollapsed) childWrap.style.display = 'none';
    for (const cid of g.children) {
      const ct = tabs.get(cid);
      if (ct) childWrap.appendChild(createTabItem(ct, false));
    }
    const addBtn = document.createElement('div');
    if (g.name !== '数据面板') {
      addBtn.style.cssText = 'padding:3px 10px 3px 22px;font-size:10px;color:#64748b;cursor:pointer;border-radius:4px;margin:1px 0;';
      addBtn.textContent = '+ 新增走查设计稿';
      addBtn.onclick = e => { e.stopPropagation(); addChildTab(g.id); };
      addBtn.onmouseenter = () => addBtn.style.background = '#334155';
      addBtn.onmouseleave = () => addBtn.style.background = 'transparent';
    } else {
      // 数据面板不显示任何按钮
    }
    if (g.name !== '数据面板') childWrap.appendChild(addBtn);
    list.appendChild(childWrap);
  }
  for (const t of leafTabs) {
    appendTabItem(list, t, false);
  }
}
function appendTabItem(list, tab, isGroup, isCollapsed) {
  const el = createTabItem(tab, isGroup, isCollapsed);
  list.appendChild(el);
}
function createTabItem(tab, isGroup, isCollapsed) {
  const el = document.createElement('div');
  el.className = 'tab-item' + (tab.id === activeTabId ? ' active' : '');
  
  // 判断是否子页面（属于某个板块）
  const isChild = !isGroup && (() => {
    for (const [, t] of tabs) if (t.isGroup && t.children.includes(tab.id)) return true;
    return false;
  })();
  
  // 板块：加折叠箭头
  if (isGroup) {
    const arrow = isCollapsed ? '▶' : '▼';
    el.innerHTML =
      '<span class="collapse-arrow" onclick="event.stopPropagation();toggleCollapse(\''+tab.id+'\')" style="width:14px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:#8b8fa3;cursor:pointer;flex-shrink:0;">'+arrow+'</span>' +
      '<span class="tab-icon">📁</span>' +
      '<span class="tab-name">' + tab.name + '</span>' +
      '<span class="tab-actions">' +
        '<button class="edit-btn" onclick="event.stopPropagation();startRename(\'' + tab.id + '\',this.parentElement.parentElement.querySelector(\'.tab-name\'))" title="重命名">✏️</button>' +
        (tabs.size > 1 ? '<button class="del-btn" onclick="event.stopPropagation();removeTab(\'' + tab.id + '\')" title="删除">✕</button>' : '') +
      '</span>';
    el.onclick = () => activateTab(tab.id);
    return el;
  }
  
  // 子页面或独立 tab：有设计稿缩略图 + 标签
  let innerIconHtml = '';
  if (!isGroup && tab.designImg) {
    innerIconHtml = '<span class="tab-icon" style="width:44px;height:44px;border-radius:4px;overflow:hidden;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e2e8f0;cursor:pointer;position:relative;" onmouseenter="showTabPreview(event,\''+tab.designImg+'\',\''+tab.name.replace(/'/g,"\\'")+'\')" onmouseleave="hideTabPreview()"><img src="'+tab.designImg+'" style="width:100%;height:100%;object-fit:cover;"></span>';
  } else {
    const icon = isGroup ? '📁' : (tab.result ? (tab.result.issues.length > 0 ? '⚠️' : '✅') : '📄');
    innerIconHtml = '<span class="tab-icon">' + icon + '</span>';
  }
  
  // 标签：已上传/未上传（针对还原稿）
  let badgeHtml = '';
  if (isChild) {
    if (tab.designImg && tab.devImg) {
      badgeHtml = '<span class="tab-badge" style="font-size:10px;padding:2px 5px;border-radius:3px;background:#166534;color:#86efac;flex-shrink:0;">已上传</span>';
    } else {
      badgeHtml = '<span class="tab-badge" style="font-size:10px;padding:2px 5px;border-radius:3px;background:#dc2626;color:#fff;font-weight:500;flex-shrink:0;">未上传</span>';
    }
  }
  
  // 研发负责人标签（子页面）
  let devTagHtml = '';
  if (isChild) {
    const devName = tab.developer || '';
    if (devName) {
      devTagHtml = '<span class="tab-devtag" style="font-size:10px;padding:2px 5px;border-radius:3px;background:#1e3a5f;color:#93c5fd;flex-shrink:0;max-width:55px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+devName+'</span>';
    }
  }
  
  el.innerHTML =
    innerIconHtml +
    '<span class="tab-name">' + tab.name + '</span>' +
    badgeHtml +
    devTagHtml +
    '<span class="tab-actions">' +
      '<button class="edit-btn" onclick="event.stopPropagation();startRename(\'' + tab.id + '\',this.parentElement.parentElement.querySelector(\'.tab-name\'))" title="重命名">✏️</button>' +

function getOverlayDataUrl(tab) {
  const img1 = new Image(); img1.crossOrigin = 'anonymous';
  const img2 = new Image(); img2.crossOrigin = 'anonymous';
  // 同步方式（先加载后渲染）
  const c = document.createElement('canvas');

// ===== Resize（只绑定一次，用事件委托） =====
let resizeActive = false;
document.addEventListener('mousedown', e => {
  const bar = e.target.closest('.resize-bar');
  if (!bar) return;
  const id = bar.id.replace('resizeBar_', '');
  const c4 = document.getElementById('c4_' + id);
  if (!c4) return;
  resizeActive = true;
  const startY = e.clientY, startH = c4.offsetHeight;
  const onMove = (ev) => {
    if (!resizeActive) return;
    const dh = ev.clientY - startY;
    c4.style.height = Math.max(80, Math.min(window.innerHeight - 200, startH + dh)) + 'px';
  };
  const onUp = () => { resizeActive = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); document.body.style.cursor = ''; };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.body.style.cursor = 'row-resize';
  e.preventDefault();
});

  const tab = tabs.get(id);
  if (!tab||!tab.designImg||!tab.devImg) return;

  renderMain(id);

// ===== Issue Table (按优先级排序) =====
function sortByPriority(issues) {
  const prioRank = { P0: 0, P1: 1, P2: 2, P3: 3 };
  return [...issues].sort((a, b) => (prioRank[a.priority] ?? 99) - (prioRank[b.priority] ?? 99));
}

function renderIssueTable(id, tab) {
  const r = tab.result;
  if (!r) return;
  const rawIssues = r.issues || [];
  const cr = r.cropUrls || [];

  // 按优先级排序
  const issues = sortByPriority(rawIssues);
  // 同步排序 cropUrls
  const prioRank = { P0: 0, P1: 1, P2: 2, P3: 3 };
  const idxMap = rawIssues.map((iss,i)=>i);
  idxMap.sort((a,b) => (prioRank[rawIssues[a].priority]??99) - (prioRank[rawIssues[b].priority]??99));
  const sortedCr = idxMap.map(i=>cr[i]);

  const h = document.getElementById('ih_'+id);
  if (h) {
    const p0=rawIssues.filter(x=>x.priority==='P0').length;
    const p1=rawIssues.filter(x=>x.priority==='P1').length;
    const p2=rawIssues.filter(x=>x.priority==='P2').length;
    h.innerHTML = `<h3>📋 差异问题</h3><span class="stats">共 ${rawIssues.length} 项 · P0: ${p0} · P1: ${p1} · P2: ${p2}</span>`;
  }
  const wrap = document.getElementById('ilw_'+id);
  if (!wrap) return;
  if (issues.length === 0) { wrap.innerHTML = '<div class="no-issues">✅ 未发现差异</div>'; return; }

  let html = `<table class="issue-table"><thead><tr>
    <th class="id-col">#</th><th class="prio-col">级别</th><th class="type-col">类型</th><th>描述</th><th>预览</th><th>详情</th>
  </tr></thead><tbody>`;
  const typeMap = { font:'字体', position:'位置', size:'尺寸', color:'颜色' };
  issues.forEach((iss,i) => {
    const src = sortedCr[i] || '';
    const previewHtml = src
      ? `<img class="preview-img" src="${src}" onclick="event.stopPropagation();openModal('${src}')">`
      : '🔍';
    html += `<tr class="${i===tab.selectedIdx?'active':''}" data-idx="${idxMap[i]}" onclick="selectIssue('${id}',${idxMap[i]})">
      <td class="id-col">${i+1}</td>
      <td class="prio-col"><span class="tag tag-${iss.priority||'P2'}">${iss.priority||'P2'}</span></td>
      <td class="type-col">${typeMap[iss.category]||iss.category}</td>
      <td>${iss.description}</td>
      <td>${previewHtml}</td>
      <td style="color:#64748b;font-size:11px;">${iss.detail||''}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  if (issues.length > 0 && tab.selectedIdx < 0) selectIssue(id, idxMap[0]);
  else if (tab.selectedIdx >= 0) drawMarkers(id, tab);
}

function selectIssue(id, idx) {
  const tab = tabs.get(id);
  if (!tab||!tab.result||!tab.result.issues[idx]) return;
  tab.selectedIdx = idx;
  document.querySelectorAll(`#ilw_${id} tr`).forEach(el=>el.classList.remove('active'));
  const row = document.querySelector(`#ilw_${id} tr[data-idx="${idx}"]`);
  if (row) row.classList.add('active');
  drawMarkers(id, tab);
}

function drawMarkers(id, tab) {
  const r = tab.result;
  const idx = tab.selectedIdx;
  if (idx < 0 || !r || !r.issues[idx]) return;
  const iss = r.issues[idx];

  // 清除旧标记
  document.querySelectorAll(`#dCell_${id} .marker, #vCell_${id} .marker`).forEach(el=>el.remove());

  const addMarker = (cellId, imgId, ox, oy) => {
    const cell = document.getElementById(cellId);
    const img = document.getElementById(imgId);
    if (!cell || !img) return;

    const tryMark = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const cw = cell.offsetWidth, ch = cell.offsetHeight;
      if (!iw || !ih || !cw || !ch) { setTimeout(tryMark, 100); return; }

      const scale = Math.min(cw / iw, ch / ih);
      const dispW = iw * scale, dispH = ih * scale;
      const offsetX = (cw - dispW) / 2, offsetY = (ch - dispH) / 2;

      // 移除旧标记
      cell.querySelectorAll('.marker').forEach(el=>el.remove());

      const m = document.createElement('div');
      m.className = 'marker';
      m.style.cssText = `position:absolute;left:${offsetX+(iss.x+ox)*scale}px;top:${offsetY+(iss.y+oy)*scale}px;width:${Math.max(iss.w*scale,2)}px;height:${Math.max(iss.h*scale,2)}px;border:2.5px solid #ff453a;border-radius:4px;pointer-events:none;z-index:2;box-shadow:0 0 8px rgba(255,69,58,.4);`;
      cell.appendChild(m);
    };
    tryMark();
  };

  addMarker('dCell_'+id, 'dImg_'+id, 0, 0);
  addMarker('vCell_'+id, 'vImg_'+id, r.align ? -r.align.dx : 0, r.align ? -r.align.dy : 0);
}

// ===== Keyboard =====
document.addEventListener('keydown', e => {
  if (!activeTabId) return;
  const tab = tabs.get(activeTabId);
  if (!tab||!tab.result||!tab.result.issues.length) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    const d = e.key==='ArrowUp' ? -1 : 1;
    const n = tab.selectedIdx + d;
    if (n>=0 && n<tab.result.issues.length) {
      selectIssue(activeTabId, n);
      const row = document.querySelector(`#ilw_${activeTabId} tr[data-idx="${n}"]`);
      if (row) row.scrollIntoView({behavior:'smooth', block:'nearest'});
    }
    e.preventDefault();
  }
});

  const cards = tab.result.cards || [];

// 重新检测文字行（使用当前滑块参数）
window.reRunTextDebug = function(id) {
  const state = window._debugState[id];
  if (!state || !state.designImg) return;
  
  // 读取滑块值
  const params = {};
  const keys = ['gradMin','gradMax','minBlock','minBlockH','maxAspect','minDensity','maxDensity','edgeDensity','lineGap','minLineW','minLineH','mergeOverlap'];
  for (const k of keys) {
    const el = document.getElementById('slider_' + k + '_' + id);
    params[k] = el ? parseFloat(el.value) : null;
  }
  
  // 用参数重新运行文字检测
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0,0,c.width,c.height);
    const iW = c.width, iH = c.height;
    
    // 构建亮度图
    const lum = new Uint8Array(iW*iH);
    for (let i = 0; i < iW*iH; i++) {
      const pi = i*4;
      lum[i] = Math.round(0.299 * imageData.data[pi] + 0.587 * imageData.data[pi+1] + 0.114 * imageData.data[pi+2]);
    }
    
    const lines = mserDetectWithParams(lum, iW, iH, 0, 0, iW, iH, params);
    
    state.lines = lines;
    state.canvasData = { img, iW, iH, lum };
    
    // 重绘
    const canvasEl = document.getElementById('debugCanvas_' + id);
    if (canvasEl) {
      canvasEl._lines = lines;
      canvasEl._buttons = [];
      const maxW = canvasEl.parentElement.offsetWidth - 20, maxH = canvasEl.parentElement.offsetHeight - 20;
      const sc = Math.min(maxW / iW, maxH / iH);
      canvasEl.width = Math.round(iW * sc);
      canvasEl.height = Math.round(iH * sc);
      canvasEl._img = img;
      canvasEl._sc = sc;
      drawDebugMarksOnCanvas('debugCanvas_' + id, lines, -1);
    }
    // 更新列表
    renderDebugTextList(id, lines, 'debugCanvas_' + id);
    // 更新顶部的字数统计
    const tabBtn = document.getElementById('tabTextBtn_' + id);
    if (tabBtn) tabBtn.textContent = '📝 文字 ' + lines.length;
  };
  img.src = state.designImg;
};

// 带参数的 mserDetectInRegion 变体
function mserDetectWithParams(ld, iW, iH, rx, ry, rw, rh, params) {
  const g = new Uint8Array(rw*rh);
  const gradMin = params.gradMin || 5;
  const gradMax = params.gradMax || 120;
  const minBlock = params.minBlock || 6;
  const minBlockH = params.minBlockH || 4;
  const maxAspect = params.maxAspect || 20;
  const minDensity = params.minDensity || 0.02;
  const maxDensity = params.maxDensity || 0.95;
  const edgeDensity = params.edgeDensity || 0.01;
  const lineGap = params.lineGap || 1.0;
  const minLineW = params.minLineW || 20;
  const minLineH = params.minLineH || 8;
  const mergeOverlap = params.mergeOverlap || 0.5;
  
  for(let y=ry+1; y<ry+rh-1; y++)
  for(let x=rx+1; x<rx+rw-1; x++){
    const idx=(y-ry)*rw+(x-rx);
    g[idx]=Math.min(255,Math.round(Math.sqrt(
      Math.pow(Math.abs(ld[y*iW+x+1]-ld[y*iW+x-1]),2)*.6 +
      Math.pow(Math.abs(ld[(y+1)*iW+x]-ld[(y-1)*iW+x]),2)*.4
    )));
  }
  
  const bn = new Uint8Array(rw*rh);
  const h = new Uint32Array(256);
  let tp=0;
  for(let i=0;i<rw*rh;i++){
    const v=g[i];
    if(v>gradMin){ h[v]++; tp++; }
  }
  let s=0;
  for(let i=0;i<256;i++) s+=i*h[i];
  let sB=0,wB=0,wF=0,mV=0,oT=12;
  for(let t=0;t<256;t++){
    wB+=h[t]; if(!wB) continue;
    wF=tp-wB; if(!wF) break;
    sB+=t*h[t];
    const mB=sB/wB, mF=(s-sB)/wF, bV=wB*wF*(mB-mF)*(mB-mF);
    if(bV>mV){ mV=bV; oT=t; }
  }
  const bT = Math.max(oT, gradMin, Math.min(oT*1.5, gradMax));
  for(let i=0;i<rw*rh;i++) bn[i]=g[i]>=bT?255:0;
  
  const mo = new Uint8Array(rw*rh);
  for(let y=0;y<rh;y++)
  for(let x=0;x<rw;x++){
    let mv=bn[y*rw+x];
    if(x>0 && bn[y*rw+x-1]>mv) mv=bn[y*rw+x-1];
    if(x<rw-1 && bn[y*rw+x+1]>mv) mv=bn[y*rw+x+1];
    mo[y*rw+x]=mv;
  }
  
  const vs = new Uint8Array(rw*rh), cs = [];
  for(let y=0;y<rh;y++)
  for(let x=0;x<rw;x++){
    const idx=y*rw+x;
    if(mo[idx]!==255||vs[idx]) continue;
    const q=[idx]; vs[idx]=1;
    let mn=x, mx=x, mnY=y, mxY=y, cnt=0;
    while(q.length){
      const ci=q.shift(); cnt++;
      const cx=ci%rw, cy=Math.floor(ci/rw);
      if(cx<mn)mn=cx; if(cx>mx)mx=cx;
      if(cy<mnY)mnY=cy; if(cy>mxY)mxY=cy;
      for(let dy=-1;dy<=1;dy++)
      for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy) continue;
        const nx=cx+dx, ny=cy+dy;
        if(nx<0||nx>=rw||ny<0||ny>=rh) continue;
        const ni=ny*rw+nx;
        if(vs[ni]||mo[ni]!==255) continue;
        vs[ni]=1; q.push(ni);
      }
    }
    const bw=mx-mn+1, bh=mxY-mnY+1;
    if(bw<minBlock || bh<minBlockH || cnt<minBlock) continue;
    const r=bw/Math.max(bh,1);
    if(r<.4||r>maxAspect) continue;
    if(cnt/(bw*bh)<minDensity||cnt/(bw*bh)>maxDensity) continue;
    let ep=0;
    for(let sy=mnY; sy<=mxY; sy++)
    for(let sx=mn; sx<=mx; sx++)
      if(bn[sy*rw+sx]===255) ep++;
    if(ep/(bw*bh)<edgeDensity) continue;
    cs.push({x:mn+rx, y:mnY+ry, w:bw, h:bh, cnt, density:ep/(bw*bh), ratio:r});
  }
  if(!cs.length) return [];
  
  // 文字区域修剪
  for(const c of cs){
    const lY=c.y-ry, lH=c.h;
    let t=lY;
    for(let y=lY; y<lY+lH; y++){
      let he=false;
      for(let sx=c.x-rx; sx<c.x-rx+c.w; sx+=2)
        if(bn[y*rw+sx]===255){he=true; break;}
      if(he){t=y; break;}
    }
    let b=lY+lH-1;
    for(let y=lY+lH-1; y>=t; y--){
      let he=false;
      for(let sx=c.x-rx; sx<c.x-rx+c.w; sx+=2)
        if(bn[y*rw+sx]===255){he=true; break;}
      if(he){b=y; break;}
    }
    const nh=b-t+1;
    if(nh>=minBlockH){ c.y=t+ry; c.h=nh; }
  }
  if(!cs.length) return [];
  
  // 按高度排序列
  const sH=[...cs].sort((a,b)=>a.h-b.h);
  const mI=Math.floor(cs.length/2);
  const bH=Math.max(sH[mI].h, 10);
  const st=[...cs].sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2));
  const yT = bH * lineGap;
  
  // 行合并
  const rows=[];
  for(const c of st){
    const cy=c.y+c.h/2;
    let found=false;
    for(let ri=rows.length-1; ri>=0; ri--){
      const r=rows[ri];
      const mY=r.comps.reduce((s,cc)=>s+cc.y+cc.h/2,0)/r.comps.length;
      if(Math.abs(cy-mY)<=yT){ r.comps.push(c); found=true; break; }
    }
    if(!found) rows.push({comps:[c]});
  }
  
  const ln=[];
  for(const r of rows){
    if(r.comps.length<1) continue;
    // 按 x 排序 comps
    const sorted = [...r.comps].sort((a,b) => a.x - b.x);
    const xPositions = sorted.map(c => c.x);
    const mn=Math.min(...sorted.map(c=>c.x));
    const mx=Math.max(...sorted.map(c=>c.x+c.w));
    const mnY=Math.min(...sorted.map(c=>c.y));
    const mxY=Math.max(...sorted.map(c=>c.y+c.h));
    ln.push({x:mn, y:mnY, w:mx-mn, h:mxY-mnY, comps:sorted.length, xPositions});
  }
  ln.sort((a,b)=>a.y-b.y);
  
  // 相邻行合并
  for(let i=0;i<ln.length;i++)
  for(let j=i+1;j<ln.length;j++){
    const vo=Math.min(ln[i].y+ln[i].h, ln[j].y+ln[j].h)-Math.max(ln[i].y, ln[j].y);
    if(vo>Math.min(ln[i].h, ln[j].h)*mergeOverlap && vo>4){
      ln[i].x=Math.min(ln[i].x, ln[j].x);
      ln[i].y=Math.min(ln[i].y, ln[j].y);
      const x2=Math.max(ln[i].x+ln[i].w, ln[j].x+ln[j].w);
      const y2=Math.max(ln[i].y+ln[i].h, ln[j].y+ln[j].h);
      ln[i].w=x2-ln[i].x; ln[i].h=y2-ln[i].y;
      ln[i].comps+=ln[j].comps;
      ln[i].xPositions = [...(ln[i].xPositions||[]), ...(ln[j].xPositions||[])].sort((a,b)=>a-b);
      ln.splice(j,1); j--;
    }
  }
  
  // 同一行内：相邻 comps 间距 > 100px 拆分为两段
  const splitLines = [];
  for (const l of ln) {
    if (!l.xPositions || l.xPositions.length < 2) {
      splitLines.push({x:l.x, y:l.y, w:l.w, h:l.h, comps:l.comps});
      continue;
    }
    const sortedX = l.xPositions.sort((a,b)=>a-b);
    let segStart = l.x;
    let segCompCount = 0;
    let prevX = l.x;
    for (let si = 0; si < sortedX.length; si++) {
      const cx = sortedX[si];
      if (si > 0 && cx - prevX > 100) {
        // 间距过大，分裂
        segCompCount++;
        prevX = cx;
        continue;
      }
      if (si === 0) continue;
      // 还没超出，继续合并（不做分裂）
      prevX = cx;
    }
    // 简单拆分：遍历 comps 按间距 > 100 切分
    const segments = [];
    let seg = { x: sortedX[0], count: 1, lastX: sortedX[0] };
    for (let si = 1; si < sortedX.length; si++) {
      if (sortedX[si] - sortedX[si-1] > 100) {
        segments.push(seg);
        seg = { x: sortedX[si], count: 1, lastX: sortedX[si] };
      } else {
        seg.count++;
        seg.lastX = sortedX[si];
      }
    }
    segments.push(seg);
    for (const s of segments) {
      splitLines.push({x:s.x, y:l.y, w:Math.max(60, s.lastX - s.x + 10), h:l.h, comps:s.count});
    }
  }
  
  return splitLines.filter(l => {
    if(l.h<minLineH) return false;
    if(l.comps<2 && l.h<20 && l.w<40) return false;
    if(l.w/l.h>30 && l.h<8) return false;
    return true;
  });
}

function renderDebugTextList(id, lines, canvasId) {
  const wrap = document.getElementById('debugList_' + id);
  if (!wrap) return;
  const table = document.createElement('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;font-size:10px;';
  table.innerHTML = '<thead><tr><th style="text-align:left;padding:3px 4px;font-size:9px;color:#8b8fa3;">#</th><th style="text-align:left;padding:3px 4px;font-size:9px;color:#8b8fa3;">XY</th><th style="text-align:left;padding:3px 4px;font-size:9px;color:#8b8fa3;">WH</th><th style="text-align:left;padding:3px 4px;font-size:9px;color:#8b8fa3;">c</th></tr></thead>';
  const tbody = document.createElement('tbody');
  lines.forEach((l,i) => {
    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    tr.innerHTML = `<td style="padding:2px 4px;color:#5e6278;">${i+1}</td><td style="padding:2px 4px;color:#c4c6d0;">${l.x},${l.y}</td><td style="padding:2px 4px;color:#c4c6d0;">${l.w}×${l.h}</td><td style="padding:2px 4px;color:#8b8fa3;">${l.comps||''}</td>`;
    tr.onmouseenter = () => {
      const state = window._debugState[id] || {};
      const c = document.getElementById(state.debugCanvasId);
      if (c) { c._lines = lines; c._buttons = []; drawDebugMarksOnCanvas(state.debugCanvasId, lines, i); }
    };
    tr.onmouseleave = () => { drawDebugMarksOnCanvas((window._debugState[id]||{}).debugCanvasId, lines, -1); };
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.innerHTML = '';
  wrap.appendChild(table);
}

function renderDebugBtnList(id, buttons, canvasId) {
  const wrap = document.getElementById('debugList_' + id);
  if (!wrap) return;
  const table = document.createElement('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;font-size:11px;';
  table.innerHTML = '<thead><tr><th style="text-align:left;padding:4px 6px;font-size:10px;color:#64748b;">#</th><th style="text-align:left;padding:4px 6px;font-size:10px;color:#64748b;">XY</th><th style="text-align:left;padding:4px 6px;font-size:10px;color:#64748b;">WH</th><th style="text-align:left;padding:4px 6px;font-size:10px;color:#64748b;">置信</th><th style="text-align:left;padding:4px 6px;font-size:10px;color:#64748b;">文字</th></tr></thead>';
  const tbody = document.createElement('tbody');
  buttons.forEach((b,i) => {
    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    tr.innerHTML = `<td style="padding:3px 6px;color:#94a3b8;">${i+1}</td><td style="padding:3px 6px;">${b.x},${b.y}</td><td style="padding:3px 6px;">${b.w}×${b.h}</td><td style="padding:3px 6px;">${Math.round(b.confidence*100)}%</td><td style="padding:3px 6px;">${b.hasText?'✅':''}</td>`;
    tr.onmouseenter = () => {
      const state = window._debugState[id] || {};
      const c = document.getElementById(state.debugCanvasId);
      if (c) { c._lines = []; c._buttons = buttons; drawButtonMarksOnCanvas(state.debugCanvasId, buttons, i); }
    };
    tr.onmouseleave = () => { drawButtonMarksOnCanvas((window._debugState[id]||{}).debugCanvasId, buttons, -1); };
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.innerHTML = '';
  wrap.appendChild(table);
}

function switchDebugTab(id, mode) {
  const state = window._debugState[id];
  if (!state) return;
  // 高亮 tab
  ['tabTextBtn_'+id, 'tabBtnBtn_'+id, 'tabDbgBtn_'+id, 'tabCardBtn_'+id].forEach(k => {
    const el = document.getElementById(k);
    if (el) el.style.background = '';
  });
  const btnMap = {text:'tabTextBtn_', btn:'tabBtnBtn_', btnDebug:'tabDbgBtn_', card:'tabCardBtn_'};
  const btnEl = document.getElementById(btnKey);
  if (btnEl) btnEl.style.background = '#e2e8f0';
  
  if (mode === 'text') {
    renderDebugTextList(id, state.lines, state.debugCanvasId);
    drawDebugMarksOnCanvas(state.debugCanvasId, state.lines, -1);
  } else if (mode === 'btn') {
    renderDebugBtnList(id, state.buttons, state.debugCanvasId);
    drawButtonMarksOnCanvas(state.debugCanvasId, state.buttons, -1);
  } else if (mode === 'btnDebug') {
    renderDebugBtnDetail(id, state.btnDebug, state.debugCanvasId);
  } else if (mode === 'card') {
    showCardDebug(id, state.cards, state.lines, state.debugCanvasId);
  }
}

function drawButtonMarksOnCanvas(canvasId, buttons, activeIdx) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const img = c._img, sc = c._sc;
  if (!img) return;
  
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  
  for (let i = 0; i < buttons.length; i++) {
    const b = buttons[i];
    const isActive = i === activeIdx;
    const x = Math.round(b.x * sc), y = Math.round(b.y * sc);
    const w = Math.round(b.w * sc), h = Math.round(b.h * sc);
    
    ctx.strokeStyle = isActive ? '#ef4444' : '#3b82f6';
    ctx.lineWidth = isActive ? 3 : 1.5;
    ctx.globalAlpha = isActive ? 1 : 0.6;
    // 用虚线和蓝色区分按钮
    ctx.setLineDash && ctx.setLineDash([4, 3]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash && ctx.setLineDash([]);
    if (isActive) {
      ctx.fillStyle = 'rgba(59,130,246,.1)';
      ctx.fillRect(x, y, w, h);
    }
    // 标签
    ctx.fillStyle = '#3b82f6';
    ctx.font = '9px sans-serif';
    ctx.fillText('B'+(i+1), x + 2, y + 9);
    // 置信度
    ctx.fillStyle = 'rgba(100,116,139,.6)';
    ctx.font = '8px sans-serif';
    ctx.fillText(Math.round(b.confidence*100)+'%', x + 2, y + h - 3);
  }
  ctx.globalAlpha = 1;
}

function drawDebugMarksOnCanvas(canvasId, lines, activeIdx) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const img = c._img, sc = c._sc;
  if (!img) return;
  
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const isActive = i === activeIdx;
    ctx.strokeStyle = isActive ? '#ef4444' : '#22c55e';
    ctx.lineWidth = isActive ? 3 : 1.5;
    ctx.globalAlpha = isActive ? 1 : 0.5;
    ctx.strokeRect(l.x * sc, l.y * sc, l.w * sc, l.h * sc);
    if (isActive) {
      ctx.fillStyle = 'rgba(239,68,68,.12)';
      ctx.fillRect(l.x * sc, l.y * sc, l.w * sc, l.h * sc);
    }
    ctx.fillStyle = isActive ? '#ef4444' : 'rgba(34,197,94,.7)';
    ctx.font = '9px sans-serif';
    ctx.fillText(i+1, l.x * sc + 2, l.y * sc + 9);
  }
  ctx.globalAlpha = 1;
}

// ===== Button Debug Panel =====

  const candidates = debug.filtered;

  const failed = candidates.filter(c => !c.isButton);
  
  let html = `<div style="font-size:11px;padding:4px 0;color:#94a3b8;">色块: ${debug.colorSeeds} 候选: ${debug.candidates} 按钮: ${passed.length}</div>`;
  
  html += '<table style="width:100%;border-collapse:collapse;font-size:10px;">';

      <td style="padding:2px 4px;">${c.x},${c.y}</td>
      <td style="padding:2px 4px;">${c.w}×${c.h}</td>
      <td style="padding:2px 4px;">${c.flatRatio}%</td>
      <td style="padding:2px 4px;">${c.edgeRatio}%</td>
      <td style="padding:2px 4px;">${c.hasText?'✅'+c.textCount:'✖️'}</td>
      <td style="padding:2px 4px;">${status}</td>
      <td style="padding:2px 4px;"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c.color};border:1px solid #e2e8f0;"></span></td>
    </tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  
  // 右侧画布画所有候选框
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const img = c._img, sc = c._sc;
  if (!img) return;
  
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  
  for (let i = 0; i < candidates.length; i++) {
    const cand = candidates[i];
    const isPass = cand.isButton;
    ctx.strokeStyle = isPass ? '#22c55e' : (cand.hasText ? '#f59e0b' : '#ef4444');
    ctx.lineWidth = isPass ? 2 : 1;
    ctx.globalAlpha = 0.7;
    ctx.strokeRect(cand.x*sc, cand.y*sc, cand.w*sc, cand.h*sc);
    
    // 编号
    ctx.fillStyle = isPass ? '#22c55e' : '#94a3b8';
    ctx.font = '8px sans-serif';
    ctx.fillText(i+1, cand.x*sc+2, cand.y*sc+8);
  }
  ctx.globalAlpha = 1;

function highlightBtnDebug(id, idx) {
  // 高亮对应候选框
  // 简单实现：重绘整个画面
  const state = window._debugState[id];
  if (!state) return;
  const c = document.getElementById(state.debugCanvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const img = c._img, sc = c._sc;
  if (!img) return;
  
  const debug = state.btnDebug;
  if (!debug || !debug.filtered) return;
  const candidates = debug.filtered;
  
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  
  for (let i = 0; i < candidates.length; i++) {
    const cand = candidates[i];
    const isActive = i === idx;
    const isPass = cand.isButton;
    
    ctx.strokeStyle = isActive ? '#ef4444' : (isPass ? '#22c55e' : '#94a3b8');
    ctx.lineWidth = isActive ? 3 : (isPass ? 2 : 1);
    ctx.globalAlpha = isActive ? 1 : 0.6;
    ctx.strokeRect(cand.x*sc, cand.y*sc, cand.w*sc, cand.h*sc);
    
    if (isActive) {
      ctx.fillStyle = 'rgba(239,68,68,.1)';
      ctx.fillRect(cand.x*sc, cand.y*sc, cand.w*sc, cand.h*sc);
    }
    
    ctx.fillStyle = isActive ? '#ef4444' : (isPass ? '#22c55e' : '#94a3b8');
    ctx.font = '8px sans-serif';
    ctx.globalAlpha = isActive ? 1 : 0.5;
    ctx.fillText(i+1, cand.x*sc+2, cand.y*sc+8);
  }
  ctx.globalAlpha = 1;
}

// ===== Card Debug =====
function showCardDebug(id, cards, lines, canvasId) {
  const listEl = document.getElementById('debugList_' + id);
  if (!listEl) return;
  
  // 在画布上绘制卡片
  const c = document.getElementById(canvasId);
  if (c && c._img) {
    const ctx = c.getContext('2d'), sc = c._sc, img = c._img;
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    
    const colors = ['#3b82f6','#f59e0b','#22c55e','#ef4444','#a855f7','#06b6d4','#ec4899','#84cc16'];
    for (let i = 0; i < cards.length; i++) {
      const cd = cards[i], col = colors[i % colors.length];
      const x = Math.round(cd.x * sc), y = Math.round(cd.y * sc);
      const w = Math.round(cd.w * sc), h = Math.round(cd.h * sc);
      ctx.fillStyle = col + '18';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 3]);
      ctx.strokeRect(x, y, w, h);
      ctx.setLineDash([]);
      ctx.fillStyle = col;
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText('📇 C'+(i+1), x+2, y+10);
      // 内部子区域
      if (cd.innerItems) {
        for (const item of cd.innerItems) {
          const ix = Math.round(item.x * sc), iy = Math.round(item.y * sc);
          const iw = Math.round(item.w * sc), ih = Math.round(item.h * sc);
          const ic = item.type === 'image' ? '#a855f7' : item.type === 'text' ? '#22c55e' : '#f59e0b';
          ctx.fillStyle = ic + '20';
          ctx.fillRect(ix, iy, iw, ih);
          ctx.strokeStyle = ic + '80';
          ctx.lineWidth = 0.5;
          ctx.setLineDash([2, 2]);
          ctx.strokeRect(ix, iy, iw, ih);
          ctx.setLineDash([]);
          ctx.fillStyle = ic;
          ctx.font = '7px sans-serif';
          ctx.fillText(item.type==='image'?'🖼':item.type==='text'?'T':'🔤', ix+1, iy+7);
        }
      }
    }
  }
  
  // 渲染列表
  if (!cards || cards.length === 0) {
    listEl.innerHTML = '<div style="color:#64748b;font-size:11px;padding:20px;text-align:center;">未检测到卡片组件</div>';
    return;
  }
  
  let html = '<div style="font-size:11px;font-weight:600;color:#e2e8f0;margin-bottom:8px;">📇 检测到的卡片 <span style="color:#8b8fa3;font-weight:400;">('+cards.length+' 张)</span></div>';
  const colors = ['#3b82f6','#f59e0b','#22c55e','#ef4444','#a855f7','#06b6d4','#ec4899','#84cc16'];
  const typeLabel = {image:'🖼 图片区域', text:'📝 文字', icon:'🔤 图标'};
  
  for (let i = 0; i < cards.length; i++) {
    const cd = cards[i], col = colors[i % colors.length];
    const hasImg = cd.innerItems ? cd.innerItems.some(item => item.type === 'image') : false;
    const textCount = cd.innerItems ? cd.innerItems.filter(item => item.type === 'text').length : 0;
    html += '<div style="margin-bottom:8px;padding:6px;border-radius:4px;background:#1e293b;border-left:3px solid '+col+';">' +
      '<div style="display:flex;justify-content:space-between;font-size:10px;color:#e2e8f0;margin-bottom:4px;">' +
      '<strong>卡片 '+(i+1)+'</strong>' +
      '<span style="color:#8b8fa3;">'+cd.w+'×'+cd.h+'px</span></div>' +
      '<div style="font-size:9px;color:#8b8fa3;margin-bottom:4px;">背景: '+cd.bgColor+' · 位置: ('+cd.x+','+cd.y+')' +
      (hasImg ? ' · 🖼 含图片' : '') +
      (textCount > 0 ? ' · 📝 '+textCount+' 行文字' : '') +
      '</div>';
    if (cd.innerItems && cd.innerItems.length > 0) {
      html += '<div style="font-size:8px;color:#64748b;">子区域:</div>';
      for (const item of cd.innerItems) {
        const ic = item.type === 'image' ? '#a855f7' : item.type === 'text' ? '#22c55e' : '#f59e0b';
        html += '<div style="font-size:8px;color:#94a3b8;padding:1px 4px;border-left:2px solid '+ic+';">' +
          (typeLabel[item.type]||item.type) + ' ('+item.x+','+item.y+') '+item.w+'×'+item.h+'px</div>';
      }
    }
    html += '</div>';
  }
  
  listEl.innerHTML = html;
}

// ===== 持久化存储（IndexedDB） =====
const DB_NAME = 'VisionGuardDB';
const DB_VERSION = 4;
const STORE_NAME = 'tabs';
const CONFIG_KEY = 'appConfig';

// 研发人员名单池（所有输入过的名字去重）
let devPool = [];

// 加载研发人员名单池
async function loadDevPool() {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const cfg = await new Promise((resolve, reject) => {
      const req = store.get(CONFIG_KEY);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    if (cfg && cfg.devPool) devPool = cfg.devPool;
  } catch(e) {
    console.warn('loadDevPool failed:', e);
  }
}

// 保存研发人员名单池
async function saveDevPool() {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.put({ id: CONFIG_KEY, devPool: devPool });
    await new Promise((resolve, reject) => {
      tx.oncomplete = resolve;
      tx.onerror = reject;
    });
  } catch(e) {
    console.warn('saveDevPool failed:', e);
  }
}

// 新增研发人员到名单池
function addToDevPool(name) {
  if (!name || devPool.includes(name)) return;
  devPool.push(name);
  devPool.sort();
  saveDevPool();
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      // 版本升级时清掉旧数据
      if (e.oldVersion > 0 && e.oldVersion < DB_VERSION) {
        if (db.objectStoreNames.contains(STORE_NAME)) {
          db.deleteObjectStore(STORE_NAME);
        }
      }
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function saveTabs() {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    // 清空旧数据
    store.clear();
    for (const [, tab] of tabs) {
      store.put({
        id: tab.id,
        name: tab.name,
        isGroup: tab.isGroup,
        children: tab.children,
        designImg: tab.designImg,
        devImg: tab.devImg,
        result: tab.result,
        overlayOpacity: tab.overlayOpacity,
        developer: tab.developer || ''
      });
    }
    await new Promise((resolve, reject) => {
      tx.oncomplete = resolve;
      tx.onerror = reject;
    });
  } catch(e) {
    console.warn('saveTabs failed:', e);
  }
}

async function loadTabs() {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const all = await new Promise((resolve, reject) => {
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    if (!all || all.length === 0) return false;
    tabs.clear();
    let maxId = 0;
    for (const rec of all) {
      tabs.set(rec.id, rec);
      const num = parseInt(rec.id.replace('tab_', ''), 10);
      if (num > maxId) maxId = num;
    }
    tabIdCounter = maxId + 1;
    return true;
  } catch(e) {
    console.warn('loadTabs failed:', e);
    return false;
  }
}

// 在每次图片上传/删除/检测后自动保存
function autoSave() {
  setTimeout(saveTabs, 100);
  autoCloudify();
}

// ===== Cloudinary 云端同步 =====
const CLOUD_NAME = 'dxm3bwnzi';
const API_KEY = '713313811327755';
const API_SECRET = 'QIBVvLSSePJW5-1UVYECknvBLBQ';
const DATA_NAME = 'visionguard_data';

let pendingCloudSync = null;
function autoCloudify() {
  if (pendingCloudSync) clearTimeout(pendingCloudSync);
  pendingCloudSync = setTimeout(cloudifyPush, 3000);
}

function setCloudStatus(text, type) {
  const el = document.getElementById('cloudStatus');
  if (!el) return;
  el.textContent = text;
  el.className = 'cloud-status' + (type ? ' ' + type : '');
}

async function cloudifyPush() {
  try {
    setCloudStatus('☁️ 推送中…', 'syncing');
    const data = {};
    for (const [id, tab] of tabs) {
      data[id] = {
        id: id, name: tab.name, isGroup: tab.isGroup, children: tab.children,
        designImg: tab.designImg, devImg: tab.devImg,
        result: tab.result ? { diffOverlay: tab.result.diffOverlay, textLines: tab.result.textLines, buttons: tab.result.buttons, issues: tab.result.issues, btnDebug: tab.result.btnDebug } : null,
        overlayOpacity: tab.overlayOpacity, developer: tab.developer || ''
      };
    }
    const json = JSON.stringify(data);
    const timestamp = Math.floor(Date.now() / 1000);
    const signStr = 'public_id=' + DATA_NAME + '&timestamp=' + timestamp + API_SECRET;
    const sig = await sha1Hex(signStr);
    const formData = new FormData();
    formData.append('file', new Blob([json], { type: 'application/json' }), 'data.json');
    formData.append('api_key', API_KEY);
    formData.append('timestamp', timestamp + '');
    formData.append('signature', sig);
    formData.append('public_id', DATA_NAME);
    formData.append('resource_type', 'raw');
    const res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/raw/upload', {
      method: 'POST', body: formData
    });
    if (!res.ok) { setCloudStatus('☁️ 推送失败', 'err'); console.warn('push fail:', await res.text()); }
    else setCloudStatus('☁️ 已同步 ✔', 'ok');
    setTimeout(() => { const el = document.getElementById('cloudStatus'); if (el) { el.textContent = '☁️ 已连接'; el.className = 'cloud-status ok'; } }, 4000);
  } catch(e) {
    console.warn('cloudify error:', e);
    setCloudStatus('☁️ 推送失败', 'err');
  }
}

async function cloudifyLoad() {
  try {
    const url = 'https://res.cloudinary.com/' + CLOUD_NAME + '/raw/upload/' + DATA_NAME + '.json?_t=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) return false;
    const remote = await res.json();
    if (!remote || typeof remote !== 'object' || Object.keys(remote).length === 0) return false;
    // 校验数据格式：每个条目必须有 name 和 isGroup 字段
    let valid = true;
    for (const [id, rec] of Object.entries(remote)) {
      if (!rec || !rec.name || typeof rec.isGroup === 'undefined') { valid = false; break; }
    }
    if (!valid) { console.warn('cloud data format invalid, ignoring'); return false; }
    // 检查 IDB 是否有数据
    try {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const all = await new Promise((resolve, reject) => {
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      if (all && all.length > 0) return false;
    } catch(e) {}
    // IDB 无数据，从云端恢复
    tabs.clear();
    let maxId = 0;
    for (const [id, rec] of Object.entries(remote)) {
      if (!rec.id) rec.id = id;
      tabs.set(id, rec);
      const num = parseInt(id.replace('tab_', ''), 10);
      if (num > maxId) maxId = num;
    }
    tabIdCounter = maxId + 1;
    return true;
  } catch(e) {
    console.warn('cloudifyLoad error:', e);
    return false;
  }
}

async function cloudifyPull() {
  setCloudStatus('☁️ 拉取中…', 'syncing');
  const restored = await cloudifyLoad();
  if (restored) {
    let defaultKey = null;
    for (const [id, tab] of tabs) {
      if (tab.isGroup && tab.name !== '数据面板') { defaultKey = id; break; }
    }
    if (!defaultKey) defaultKey = tabs.keys().next().value;
    if (defaultKey) {
      activeTabId = defaultKey;
      renderTabList();
      renderMain(defaultKey);
    }
    setCloudStatus('☁️ 已拉取 ✔', 'ok');
  } else {
    setCloudStatus('☁️ 拉取失败', 'err');
  }
  setTimeout(() => {
    const el = document.getElementById('cloudStatus');
    if (el) { el.textContent = '☁️ 已连接'; el.className = 'cloud-status ok'; }
  }, 4000);
}

function sha1Hex(str) {
  return crypto.subtle.digest('SHA-1', new TextEncoder().encode(str))
    .then(buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join(''));
}

// ===== 批量导入设计稿 =====
function handleBatchImportDesigns(event, groupId) {
  const files = Array.from(event.target.files);
  if (files.length === 0) return;
  files.sort((a, b) => a.name.localeCompare(b.name));
  const g = tabs.get(groupId);
  if (!g) return;
  for (const f of files) {
    const cid = 'tab_' + (tabIdCounter++);
    const name = f.name.replace(/\.[^.]+$/, '');
    tabs.set(cid, {
      id: cid, name: name, isGroup: false, children: [],
      designImg: null, devImg: null, result: null, selectedIdx: -1, overlayOpacity: 0.5
    });
    g.children.push(cid);
    const r = new FileReader();
    r.onload = e => { const t = tabs.get(cid); if (t) { t.designImg = e.target.result; if (activeTabId === groupId) renderMain(activeTabId); } };
    r.readAsDataURL(f);
  }
  event.target.value = '';
  renderTabList();
  activateTab(groupId);
  autoSave();
}

// ===== 子页面在概览中直接上传 =====
function handlePageImgUpload(event, pageId, key) {
  const file = event.target.files[0];
  if (!file) return;
  const tab = tabs.get(pageId);
  if (!tab) return;
  const r = new FileReader();
  r.onload = e => {
    tab[key] = e.target.result;
    tab.result = null;
    const active = tabs.get(activeTabId);
    if (active && active.isGroup && active.children.includes(pageId)) renderMain(activeTabId);
    else renderMain(pageId);
    autoSave();
  };
  r.readAsDataURL(file);
}

function clearPageImg(pageId, key) {
  const tab = tabs.get(pageId);
  if (!tab) return;
  tab[key] = null;
  tab.result = null;
  const active = tabs.get(activeTabId);
  if (active && active.isGroup && active.children.includes(pageId)) renderMain(activeTabId);
  else renderMain(pageId);
  autoSave();
}

let figmaImportGroupId = null;
let figmaSavedToken = '';

async function startFigmaImport() {
  const url = document.getElementById('figmaUrl').value.trim();
  const token = document.getElementById('figmaToken').value.trim();
  const rule = document.getElementById('figmaGroupRule').value;
  const btn = document.getElementById('figmaImportBtn');
  const progress = document.getElementById('figmaImportProgress');
  
  if (!url || !token) { progress.style.display = 'block'; progress.textContent = '❌ 请填写文件链接和 Token'; return; }
  
  // 记住 Token
  figmaSavedToken = token;
  localStorage.setItem('figmaToken', token);
  
  const fileKeyMatch = url.match(/figma\.com\/(?:design|file)\/([a-zA-Z0-9]+)/);
  if (!fileKeyMatch) { progress.style.display = 'block'; progress.textContent = '❌ 无法识别文件链接'; return; }
  const fileKey = fileKeyMatch[1];
  
  btn.disabled = true; btn.textContent = '⏳ 加载中...';
  progress.style.display = 'block';
  progress.innerHTML = '⏳ 正在获取设计稿信息...';
  
  try {
    // node-id 格式如 0-1 → 0:1，但对我们只取全部 Frame 的话不需要
    // 直接拉取整个文档
    const res = await fetch(`https://api.figma.com/v1/files/${fileKey}`, {
      headers: { 'X-Figma-Token': token }
    });
    if (!res.ok) { progress.innerHTML = '❌ Figma API 请求失败: ' + res.status; btn.disabled = false; btn.textContent = '开始导入'; return; }
    const data = await res.json();
    
    // 遍历所有节点，按 Section 分组收取最外层的 Frame
    const frames = [];
    function collectFrames(node, sectionName) {
      if (!node || !node.children) return;
      for (const child of node.children) {
        if (child.type === 'FRAME') {
          frames.push({ id: child.id, name: child.name, type: child.type, parentName: sectionName || node.name });
        } else if (child.type === 'SECTION') {
          // Section 节点：下面的 FRAME 都归该 Section
          collectFrames(child, child.name);
        }
      }
    }
    if (data.document && data.document.children) {
      for (const page of data.document.children) {
        collectFrames(page, page.name);
      }
    }
    
    if (frames.length === 0) {
      progress.innerHTML = '❌ 未找到任何 Frame';
      btn.disabled = false; btn.textContent = '开始导入';
      return;
    }
    
    progress.innerHTML = `⏳ 找到 ${frames.length} 个 Frame，正在获取截图链接...`;
    
    // 分页请求所有 Frame 的图片 URL，避免 URL 过长导致 400
    const BATCH_SIZE = 50;
    const allFrames = frames;
    progress.innerHTML = `⏳ 找到 ${allFrames.length} 个 Frame，正在分批获取截图...`;
    const allImages = {};
    for (let batchStart = 0; batchStart < allFrames.length; batchStart += BATCH_SIZE) {
      const batch = allFrames.slice(batchStart, batchStart + BATCH_SIZE);
      const batchIds = batch.map(f => f.id).join(',');
      progress.innerHTML = `⏳ 正在获取截图 (${batchStart + 1}-${Math.min(batchStart + BATCH_SIZE, allFrames.length)}/${allFrames.length})...`;
      const imgRes = await fetch(`https://api.figma.com/v1/images/${fileKey}?ids=${batchIds}&format=png&scale=1`, {
        headers: { 'X-Figma-Token': token }
      });
      if (!imgRes.ok) { progress.innerHTML = '❌ 图片导出失败: ' + imgRes.status; btn.disabled = false; btn.textContent = '开始导入'; return; }
      const imgData = await imgRes.json();
      Object.assign(allImages, imgData.images || {});
    }
    
    progress.innerHTML = `⏳ 正在并行下载 ${frames.length} 张截图...`;
    
    // 并行下载所有图片
    const downloadPromises = frames.map(async (frame) => {
      const imgUrl = allImages && allImages[frame.id];
      if (!imgUrl) return null;
      try {
        const imgResp = await fetch(imgUrl, { mode: 'cors' });
        if (!imgResp.ok) return null;
        const blob = await imgResp.blob();
        const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
        progress.innerHTML = `⏳ 正在并行下载 ${frames.length} 张截图...`;
        return { frame, dataUrl };
      } catch {
        return null;
      }
    });
    
    const results = await Promise.all(downloadPromises);
    const validResults = results.filter(r => r !== null);
    
    progress.innerHTML = `⏳ 正在创建 ${validResults.length} 个子页面...`;
    
    // 用于映射名称到板块
    const groupMap = new Map();
    
    for (const { frame, dataUrl } of validResults) {
      let targetGroupId = null;
      let childName = frame.name;
      
      if (rule === 'flat') {
        targetGroupId = figmaImportGroupId || 'tab_1';
      } else if (rule === 'section') {
        const sectionName = frame.parentName || '未分组';
        if (!groupMap.has(sectionName)) {
          const gid = 'tab_' + (tabIdCounter++);
          tabs.set(gid, { id: gid, name: sectionName, isGroup: true, children: [], designImg: null, devImg: null, result: null, selectedIdx: -1, overlayOpacity: 0.5 });
          groupMap.set(sectionName, gid);
        }
        targetGroupId = groupMap.get(sectionName);
      } else {
        const parts = frame.name.split('/').map(s => s.trim());
        if (parts.length > 1) {
          const sectionName = parts[0];
          childName = parts.slice(1).join(' - ');
          if (!groupMap.has(sectionName)) {
            const gid = 'tab_' + (tabIdCounter++);
            tabs.set(gid, { id: gid, name: sectionName, isGroup: true, children: [], designImg: null, devImg: null, result: null, selectedIdx: -1, overlayOpacity: 0.5 });
            groupMap.set(sectionName, gid);
          }
          targetGroupId = groupMap.get(sectionName);
        } else {
          targetGroupId = figmaImportGroupId || 'tab_1';
        }
      }
      
      const cid = 'tab_' + (tabIdCounter++);
      tabs.set(cid, { id: cid, name: childName, isGroup: false, children: [], designImg: dataUrl, devImg: null, result: null, selectedIdx: -1, overlayOpacity: 0.5 });
      const group = tabs.get(targetGroupId);
      if (group) group.children.push(cid);
    }
    
    progress.innerHTML = `✅ 导入完成！成功 ${validResults.length} 个${validResults.length < frames.length ? '，失败 ' + (frames.length - validResults.length) + ' 个' : ''}`;
    
    setTimeout(() => {
      const ov = document.getElementById('figmaImportOverlay');
      if (ov) ov.remove();
    }, 2000);
    
    renderTabList();
    await saveTabs();
    if (figmaImportGroupId) activateTab(figmaImportGroupId);
    
  } catch(e) {
    progress.innerHTML = '❌ 导入失败: ' + e.message;
  }
  btn.disabled = false; btn.textContent = '开始导入';
}

function renderDashboard(group) {
  const main = document.getElementById('mainArea');
  // 统计所有有结果的一级 tab（非板块）和所有板块下的子页面，按 id 去重
  const allTabsWithResult = [];
  const seenIds = new Set();
  for (const [, t] of tabs) {
    if (t.isGroup) {
      // 跳过数据面板本身
      if (t.name === '数据面板') continue;
      // 板块下的子页面
      for (const cid of t.children) {

        <div style="background:#fff;border-radius:8px;padding:14px;border:1px solid #e2e8f0;text-align:center;">

        <div style="background:#fff;border-radius:8px;padding:14px;border:1px solid #e2e8f0;text-align:center;">
          <div style="font-size:28px;font-weight:700;color:#f59e0b;">${p1}</div>
          <div style="font-size:11px;color:#64748b;margin-top:4px;">P1 主要问题</div>
        </div>
        <div style="background:#fff;border-radius:8px;padding:14px;border:1px solid #e2e8f0;text-align:center;">
          <div style="font-size:28px;font-weight:700;color:#3b82f6;">${p2}</div>
          <div style="font-size:11px;color:#64748b;margin-top:4px;">P2 次要问题</div>
        </div>
        <div style="background:#fff;border-radius:8px;padding:14px;border:1px solid #e2e8f0;text-align:center;">
          <div style="font-size:28px;font-weight:700;color:#22c55e;">${allTabsWithResult.length}</div>
          <div style="font-size:11px;color:#64748b;margin-top:4px;">已检测页面</div>
        </div>
      </div>

      <!-- 图表区：饼图 + 柱状图（紧凑型） -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div style="background:#fff;border-radius:8px;border:1px solid #e2e8f0;padding:8px;">

      ctx.arc(cx, cy, r, startAngle, endAngle);
      ctx.arc(cx, cy, innerR, endAngle, startAngle, true);
      ctx.closePath();
      ctx.fillStyle = catColors[cat] || '#94a3b8';
      ctx.fill();
      startAngle = endAngle;

    ctx.textBaseline = 'middle';
    ctx.fillText(total, cx, cy - 3);
    ctx.fillStyle = '#64748b';
    ctx.font = '8px sans-serif';

      ctx.fillStyle = catColors[cat] || '#94a3b8';
      ctx.fillRect(130, ly, 8, 8);
      ctx.fillStyle = '#334155';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText((catNames[cat]||cat) + ' ' + count + '(' + pct + '%)', 142, ly);
      ly += 18;
    }

    const bpr = window.devicePixelRatio || 1;
    const bw = 300, bh = 150;

    barC.height = bh * bpr;
    barC.style.width = bw + 'px';
    barC.style.height = bh + 'px';
    const bctx = barC.getContext('2d');
    bctx.scale(bpr, bpr);
    bctx.clearRect(0,0,bw,bh);
    const priData = [
      {label:'P0',count:p0,color:'#ef4444',grad:['#ef4444','#dc2626']},
      {label:'P1',count:p1,color:'#f59e0b',grad:['#f59e0b','#d97706']},
      {label:'P2',count:p2,color:'#3b82f6',grad:['#60a5fa','#3b82f6']}
    ];
    const maxVal = Math.max(p0,p1,p2,1);
    const barW = 36, barGap = 24, baseY = 130, startX = 60;
    // 网格线
    bctx.strokeStyle = '#f1f5f9';
    bctx.lineWidth = 1;
    for (let gv = 0; gv <= 4; gv++) {
      const gy = baseY - (gv / 4) * 90;
      bctx.beginPath();
      bctx.moveTo(30, gy);
      bctx.lineTo(280, gy);
      bctx.stroke();
      bctx.fillStyle = '#cbd5e1';
      bctx.font = '8px sans-serif';
      bctx.textAlign = 'right';
      bctx.textBaseline = 'middle';
      bctx.fillText(Math.round(maxVal * gv / 4), 26, gy);
    }
    for (let i = 0; i < priData.length; i++) {
      const d = priData[i];
      const bx = startX + i * (barW + barGap);
      const barHeight = Math.max(2, (d.count / maxVal) * 90);
      const by = baseY - barHeight;
      const grad = bctx.createLinearGradient(bx, by, bx, baseY);
      grad.addColorStop(0, d.grad[0]);
      grad.addColorStop(1, d.grad[1]);
      bctx.fillStyle = grad;
      bctx.fillRect(bx, by, barW, barHeight);
      // 数值
      bctx.fillStyle = '#334155';
      bctx.font = 'bold 12px sans-serif';
      bctx.textAlign = 'center';
      bctx.textBaseline = 'bottom';
      bctx.fillText(d.count, bx + barW/2, by - 4);
      // 标签
      bctx.fillStyle = '#64748b';
      bctx.font = '9px sans-serif';
      bctx.textBaseline = 'top';
      bctx.fillText(d.label, bx + barW/2, baseY + 2);
    }
    // 基线
    bctx.strokeStyle = '#e2e8f0';
    bctx.lineWidth = 1;
    bctx.beginPath();
    bctx.moveTo(30, baseY);
    bctx.lineTo(280, baseY);
    bctx.stroke();
  
    // 板块评分对比条形图
    renderGroupCompareChart();
    renderDevDashboardStats();
  }, 50);
}

// ===== 研发负责人统计（数据面板内联）=====
function renderDevDashboardStats() {
  const el = document.getElementById('devStatsSection');
  if (!el) return;

  // 收集所有有检测结果的子页面，按研发负责人分组
  const devMap = {};
  for (const [, t] of tabs) {
    if (t.isGroup || !t.developer || !t.result) continue;
    const dev = t.developer;
    const issues = t.result.issues || [];
    const p0c = issues.filter(i => i.priority === 'P0').length;
    const p1c = issues.filter(i => i.priority === 'P1').length;
    const score = Math.round(Math.max(0, 100 - issues.length * 5 - p0c * 10 - p1c * 5));
    if (!devMap[dev]) devMap[dev] = { name: dev, items: [], totalIssues: 0, totalP0: 0, totalP1: 0, scores: [] };
    devMap[dev].items.push({ tabName: t.name, score, issues: issues.length, p0: p0c, p1: p1c });
    devMap[dev].totalIssues += issues.length;
    devMap[dev].totalP0 += p0c;
    devMap[dev].totalP1 += p1c;
    devMap[dev].scores.push(score);
  }

  const list = Object.values(devMap);
  if (!list.length) {
    el.innerHTML = '<div style="color:#94a3b8;font-size:12px;padding:12px;text-align:center;">暂无数据，请在子页面设置研发负责人</div>';
    return;
  }

  // 算平均分，按分数排序
  for (const d of list) d.avgScore = Math.round(d.scores.reduce((a,b)=>a+b,0)/d.scores.length);
  list.sort((a,b) => b.avgScore - a.avgScore);

  // 概览卡片
  let html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px;">';
  for (const d of list) {
    const c = d.avgScore >= 90 ? '#22c55e' : d.avgScore >= 70 ? '#f59e0b' : '#ef4444';
    html += '<div style="background:#f8fafc;border-radius:6px;border:1px solid #e2e8f0;padding:8px;text-align:center;">' +
      '<div style="font-size:13px;font-weight:600;color:#334155;">' + d.name + '</div>' +
      '<div style="font-size:22px;font-weight:700;color:' + c + ';margin:2px 0;">' + d.avgScore + '</div>' +
      '<div style="font-size:10px;color:#94a3b8;">' + d.items.length + ' 个页面 · P0:' + d.totalP0 + ' P1:' + d.totalP1 + '</div>' +
      '</div>';
  }
  html += '</div>';

  // 表格详情报
  html += '<table style="width:100%;border-collapse:collapse;font-size:11px;">' +
    '<tr style="background:#f1f5f9;"><th style="padding:5px 8px;text-align:left;font-weight:600;color:#475569;">研发</th><th style="padding:5px 8px;text-align:center;font-weight:600;color:#475569;">页面数</th><th style="padding:5px 8px;text-align:center;font-weight:600;color:#475569;">平均分</th><th style="padding:5px 8px;text-align:center;font-weight:600;color:#475569;">P0</th><th style="padding:5px 8px;text-align:center;font-weight:600;color:#475569;">P1</th><th style="padding:5px 8px;text-align:center;font-weight:600;color:#475569;">共问题</th></tr>';
  for (const d of list) {
    const c = d.avgScore >= 90 ? '#22c55e' : d.avgScore >= 70 ? '#f59e0b' : '#ef4444';
    const pagesDetail = d.items.map(p => p.tabName + ':' + p.score).join('、');
    html += '<tr style="border-top:1px solid #e2e8f0;">' +
      '<td style="padding:5px 8px;font-weight:500;color:#334155;">' + d.name + '</td>' +
      '<td style="padding:5px 8px;text-align:center;color:#64748b;">' + d.items.length + '</td>' +
      '<td style="padding:5px 8px;text-align:center;font-weight:600;color:' + c + ';">' + d.avgScore + '</td>' +
      '<td style="padding:5px 8px;text-align:center;color:#ef4444;">' + d.totalP0 + '</td>' +
      '<td style="padding:5px 8px;text-align:center;color:#f59e0b;">' + d.totalP1 + '</td>' +
      '<td style="padding:5px 8px;text-align:center;color:#64748b;">' + d.totalIssues + '</td></tr>';
    html += '<tr style="border-top:none;"><td colspan="6" style="padding:0 8px 6px;font-size:9px;color:#94a3b8;">页面详情: ' + pagesDetail + '</td></tr>';
  }
  html += '</table>';

  el.innerHTML = html;
}

function renderGroupCompareChart() {
  var chartEl = document.getElementById('groupCompareChart');
  if (!chartEl) return;
  
  var groupStats = [];
  // 总页面数（含无还原稿的）
  var totalAllPages = 0;
  for (var _i = 0, _a = Array.from(tabs.entries()); _i < _a.length; _i++) {
    var t = _a[_i][1];
    if (t.isGroup && t.name !== '数据面板') {
      var childrenCount = t.children.length;
      var hasResultCount = 0, hasDevImgCount = 0;
      var totalScore = 0, gp0 = 0, gp1 = 0, gtotal = 0;
      for (var _j = 0; _j < t.children.length; _j++) {
        var ct = tabs.get(t.children[_j]);
        if (ct) {
          totalAllPages++;
          if (ct.devImg) hasDevImgCount++;
          if (ct.result) {
            hasResultCount++;
            var issues = ct.result.issues;
            var p0count = 0, p1count = 0;
            for (var _k = 0; _k < issues.length; _k++) {
              if (issues[_k].priority === 'P0') p0count++;
              if (issues[_k].priority === 'P1') p1count++;
            }
            var score = Math.round(Math.max(0, 100 - issues.length * 5 - p0count * 10 - p1count * 5));
            totalScore += score;
            gp0 += p0count;
            gp1 += p1count;
            gtotal += issues.length;
          }
        }
      }
      if (childrenCount > 0) {
        var devRate = childrenCount > 0 ? Math.round(hasDevImgCount / childrenCount * 100) : 0;
        groupStats.push({
          name: t.name,
          pages: childrenCount,
          hasResult: hasResultCount,
          hasDevImg: hasDevImgCount,
          devRate: devRate,
          avgScore: hasResultCount > 0 ? Math.round(totalScore / hasResultCount) : '-',
          p0: gp0, p1: gp1, totalIssues: gtotal
        });
      }
    }
  }
  
  if (groupStats.length === 0) {
    chartEl.innerHTML = '<div style="color:#94a3b8;font-size:12px;text-align:center;padding:20px;">暂无已检测的板块数据</div>';
    return;
  }
  
  groupStats.sort(function(a, b) { return (a.avgScore === '-' ? 0 : a.avgScore) - (b.avgScore === '-' ? 0 : b.avgScore); });
  groupStats.reverse();
  
  var html = '<div style="display:flex;flex-direction:column;gap:10px;">';
  html += '<div style="display:grid;grid-template-columns:1fr 60px 70px 70px 60px 60px;gap:4px;padding:0 4px 4px;border-bottom:1px solid #e2e8f0;font-size:10px;font-weight:600;color:#94a3b8;">';
  html += '<div>板块</div><div style="text-align:center;">页面</div><div style="text-align:center;">还原稿率</div><div style="text-align:center;">问题</div><div style="text-align:center;">P0/P1</div><div style="text-align:center;">评分</div>';
  html += '</div>';
  
  for (var _m = 0; _m < groupStats.length; _m++) {
    var gs = groupStats[_m];
    var barColor = gs.avgScore >= 90 ? '#22c55e' : gs.avgScore >= 70 ? '#f59e0b' : '#ef4444';
    html += '<div style="display:grid;grid-template-columns:1fr 60px 70px 70px 60px 60px;align-items:center;gap:4px;padding:4px;border-radius:6px;background:#fafafa;">';
    html += '<div style="font-size:11px;color:#334155;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + gs.name + '</div>';
    html += '<div style="font-size:12px;color:#64748b;text-align:center;">' + gs.pages + '</div>';
    html += '<div style="font-size:12px;color:' + (gs.devRate >= 80 ? '#22c55e' : gs.devRate >= 50 ? '#f59e0b' : '#ef4444') + ';text-align:center;">' + gs.devRate + '%</div>';
    html += '<div style="font-size:12px;color:#64748b;text-align:center;">' + gs.totalIssues + '</div>';
    html += '<div style="font-size:11px;color:#ef4444;text-align:center;">' + (gs.p0+gs.p1 > 0 ? gs.p0 + '/' + gs.p1 : '-') + '</div>';
    html += '<div style="font-size:14px;font-weight:700;color:' + barColor + ';text-align:center;">' + gs.avgScore + '</div>';
    html += '</div>';
  }
  html += '</div>';
  
  chartEl.innerHTML = html;
}






// ===== 全能检测（解耦模式，独立于主线 vgDetect）=====
async function omnipotentDetect(id) {
  const tab = tabs.get(id);
  if (!tab || !tab.designImg || !tab.devImg) return;
  
  const s = document.querySelector(`#ub_${id} .status`);
  if (s) s.textContent = '⏳ 全能检测中…';
  
  try {
    // Step 1: 先跑标准检测获取基础数据 (diff overlay, text lines, buttons等)
    const baseResult = await window.vgDetect(tab.designImg, tab.devImg);
    if (!baseResult) {
      if (s) s.textContent = '❌ 基础检测失败';
      return;
    }
    
    // Step 2: 从 baseResult 提取已有检测结果
    const existingIssues = baseResult.issues || [];
    const existingButtons = baseResult.buttons || [];
    const existingCards = baseResult.cards || [];
    const textLines = baseResult.textLines || [];
    
    // 分类现有问题
    const cardIssues = existingIssues.filter(is => is.description.includes('卡片'));
    const buttonIssues = existingIssues.filter(is => is.description.includes('按钮'));
    const otherIssues = existingIssues.filter(is => !is.description.includes('卡片') && !is.description.includes('按钮'));

    // 3a: 分析按钮区域 — 对已有 buttons 做二次校验
    for (const btn of existingButtons) {

        return ix < ix2 && iy < iy2;

        // 实际开发中这里可改为：置信度较低时才报问题

    }

        const iy = Math.max(card.y, is.y);

        const iy2 = Math.min(card.y + card.h, is.y + is.h);
        return ix < ix2 && iy < iy2;
      });

        // 添加卡片通过标记或低置信度警告

    }

    }
    
    // Step 4: 汇总结果 — 卡片/按钮相关问题优先排前面
    const omniIssues = [
      ...cardIssues,
      ...buttonIssues,
      ...otherIssues
    ];
    
    // 按优先级排序
    const prioRank = { P0: 0, P1: 1, P2: 2, P3: 3 };
    omniIssues.sort((a, b) => (prioRank[a.priority] || 99) - (prioRank[b.priority] || 99));
    omniIssues.forEach((is, i) => is.regionIndex = i + 1);
    
    // 保存到 tab（命名空间隔离）
    tab.omniResult = {
      issues: omniIssues,
      align: baseResult.align,
      diffOverlay: baseResult.diffOverlay,
      textLines: textLines,
      buttons: existingButtons,
      cards: existingCards,
      elements: []  // 预留
    };
    
    // 显示结果
    tab.result = tab.omniResult;
    renderMain(id);
    renderTabList();
    updateTabStats();
    
    if (s) s.textContent = cardIssues.length + buttonIssues.length > 0 
      ? '✅ 全能检测: ' + omniIssues.length + ' 个问题 (重点: ' + (cardIssues.length + buttonIssues.length) + ' 项卡片/按钮问题)'
      : '✅ 全能检测完成 (' + omniIssues.length + ' 个问题)';
      
  } catch (e) {
    console.error('omnipotentDetect error:', e);
    if (s) s.textContent = '❌ ' + e.message;
  }
}

// ===== 侧栏问题统计 =====
function updateTabStats() {
  const el = document.getElementById('tabbarStats');
  if (!el) return;
  let totals = { P0: 0, P1: 0, P2: 0, P3: 0 };
  let hasIssues = false;
  for (const [, t] of tabs) {
    if (t.isGroup || !t.result || !t.result.issues) continue;
    hasIssues = true;
    for (const is of t.result.issues) {
      const p = is.priority;
      if (totals[p] !== undefined) totals[p]++;
    }
  }
  el.innerHTML = '';
  if (!hasIssues) { el.classList.remove('show'); return; }
  el.classList.add('show');
  const colors = { P0: '#ef4444', P1: '#f97316', P2: '#eab308', P3: '#22c55e' };
  const names = { P0: '严重', P1: '高', P2: '中', P3: '低' };
  for (const p of ['P0', 'P1', 'P2', 'P3']) {
    if (totals[p] > 0) {
      const span = document.createElement('span');
      span.className = 'stat-item';
      span.innerHTML = `<span class="stat-dot" style="background:${colors[p]}"></span>${names[p]} ${totals[p]}`;
      el.appendChild(span);
    }
  }
}

function toHex(v) {
  return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
}
