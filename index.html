<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<title>VisionGuard | Team Workspace</title>
<style>
/* ===== Google Material Design 3 基础重置 ===== */
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; background: #F8F9FA; color: #202124; -webkit-font-smoothing: antialiased; }

.app { display: flex; height: 100vh; }

/* ===== 左侧 Tab 栏（Google Workspace 风格） ===== */
.tabbar { width: 280px; background: #FFFFFF; display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid #DADCE0; z-index: 10; }
.tabbar-header { padding: 20px 24px 16px; border-bottom: 1px solid #DADCE0; display: flex; flex-direction: column; gap: 8px; }
.tabbar-header h3 { color: #202124; font-size: 20px; font-weight: 500; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
.tabbar-header h3 span { font-size: 12px; font-weight: 500; color: #1A73E8; background: #E8F0FE; padding: 2px 8px; border-radius: 12px; }

.tabbar-actions { padding: 12px 16px 4px; }
.btn-add-group { width: 100%; padding: 10px 16px; font-size: 14px; font-weight: 500; font-family: 'Google Sans', sans-serif; border: 1px solid #DADCE0; border-radius: 24px; background: #FFFFFF; color: #1A73E8; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.1); }
.btn-add-group:hover { background: #F8F9FA; box-shadow: 0 1px 3px 1px rgba(60,64,67,0.15); }

.tab-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.tab-list .tab-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 24px; cursor: pointer; user-select: none; transition: background 0.15s; margin: 2px 12px 2px 0; border-radius: 0 24px 24px 0; color: #3C4043; }
.tab-list .tab-item:hover { background: #F1F3F4; }
.tab-list .tab-item.active { background: #E8F0FE; color: #1A73E8; }
.tab-list .tab-item .tab-icon { font-size: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 20px; }
.tab-list .tab-item .tab-name { font-size: 14px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'Google Sans', sans-serif; }
.tab-list .tab-item.active .tab-name { font-weight: 700; }
.tab-list .tab-item .tab-actions { display: none; gap: 4px; flex-shrink: 0; }
.tab-list .tab-item:hover .tab-actions { display: flex; }
.tab-list .tab-item .tab-actions button { width: 24px; height: 24px; border: none; border-radius: 50%; background: transparent; color: #5F6368; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.tab-list .tab-item .tab-actions button:hover { background: rgba(60,64,67,0.1); color: #202124; }
.tab-list .tab-item .tab-actions .del-btn:hover { background: #FCE8E6; color: #D93025; }
.tab-list .tab-item .inline-edit { flex: 1; background: #FFFFFF; border: 1px solid #1A73E8; border-radius: 4px; color: #202124; font-size: 14px; padding: 4px 8px; outline: none; min-width: 0; font-family: 'Google Sans', sans-serif; }
.tab-list .sub-page-wrap { padding-left: 20px; border-left: 2px solid transparent; }

/* ===== 云端控制面板 ===== */
.cloud-panel { background: #FFFFFF; border-top: 1px solid #DADCE0; padding: 16px 24px; flex-shrink: 0; }
.cloud-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.cloud-status { font-size: 13px; font-weight: 500; font-family: 'Google Sans', sans-serif; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 16px; background: #F1F3F4; color: #5F6368; }
.cloud-status.ok { background: #E6F4EA; color: #137333; }
.cloud-status.syncing { background: #FEF7E0; color: #B06000; }
.cloud-status.err { background: #FCE8E6; color: #C5221F; }
.cloud-btns { display: flex; gap: 8px; }
.cloud-btn { flex: 1; padding: 8px; font-size: 12px; font-weight: 500; font-family: 'Google Sans', sans-serif; border: 1px solid #DADCE0; border-radius: 4px; cursor: pointer; transition: all 0.2s; background: #FFFFFF; color: #3C4043; }
.cloud-btn:hover { background: #F8F9FA; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3); }

/* ===== 主内容区域 ===== */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #F8F9FA;}

/* ===== 统一上传/控制栏 ===== */
.upload-bar { display: flex; gap: 12px; align-items: center; padding: 12px 24px; background: #FFFFFF; border-bottom: 1px solid #DADCE0; flex-shrink: 0; flex-wrap: wrap; z-index: 5; }
.upload-bar .file-label { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; color: #3C4043; transition: all 0.2s; }
.upload-bar .file-label:hover { background: #F8F9FA; }
.upload-bar .file-label.has-img { border-color: #34A853; background: #E6F4EA; color: #137333; }
.upload-bar .file-label input { display: none; }
.upload-bar .detect-btn { padding: 8px 20px; border-radius: 4px; border: none; background: #1A73E8; color: #fff; font-size: 14px; font-weight: 500; font-family: 'Google Sans', sans-serif; cursor: pointer; transition: all 0.2s; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3); }
.upload-bar .detect-btn:hover { background: #1B66C9; box-shadow: 0 1px 3px 1px rgba(60,64,67,0.15); }
.upload-bar .detect-btn:disabled { background: #F1F3F4; color: #9AA0A6; box-shadow: none; cursor: not-allowed; }

/* ===== 四列对比（子页面用） ===== */
.compare-4 { display: flex; height: 50%; min-height: 260px; gap: 16px; flex-shrink: 0; padding: 16px 24px 0; }
.compare-4 .cell { flex: 1; display: flex; align-items: center; justify-content: center; background: #FFFFFF; overflow: hidden; position: relative; border-radius: 8px; cursor: pointer; border: 1px solid #DADCE0; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.1); }
.compare-4 .cell .cell-enlarge { position: absolute; top: 10px; right: 10px; font-size: 16px; color: #5F6368; background: #FFFFFF; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; z-index: 4; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3); border: 1px solid #DADCE0; }
.compare-4 .cell:hover .cell-enlarge { opacity: 1; }
.compare-4 .cell .drop-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 100%; color: #80868B; background: #F8F9FA; }
.compare-4 .cell .cell-label { position: absolute; top: 10px; left: 12px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.9); color: #3C4043; z-index: 3; border: 1px solid #DADCE0; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.1); }
.compare-4 .cell .cell-img { width: 100%; height: 100%; object-fit: contain; }
.overlay-wrap { position: relative; width: 100%; height: 100%; }
.overlay-wrap img { position: absolute; max-width: 100%; max-height: 100%; left: 50%; top: 50%; transform: translate(-50%,-50%); }

.resize-bar { position: relative; height: 16px; cursor: row-resize; flex-shrink: 0; display: flex; align-items: center; justify-content: center; z-index: 5; margin: 4px 0; }
.resize-bar::after { content: ''; width: 40px; height: 4px; background: #DADCE0; border-radius: 2px; }

/* ===== 问题面板 / 表格 ===== */
.issue-panel { flex: 1; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 8px; margin: 0 24px 24px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.1); overflow: hidden; }
.issue-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #DADCE0; background: #FFFFFF; }
.issue-header h3 { font-size: 16px; font-weight: 500; font-family: 'Google Sans', sans-serif; color: #202124; }
.issue-list-wrap { overflow-y: auto; flex: 1; }

.issue-table { width: 100%; border-collapse: collapse; text-align: left; }
.issue-table th { position: sticky; top: 0; background: #F8F9FA; padding: 12px 16px; font-size: 12px; font-weight: 500; color: #5F6368; border-bottom: 1px solid #DADCE0; z-index: 1; }
.issue-table td { padding: 12px 16px; font-size: 13px; color: #3C4043; border-bottom: 1px solid #E8EAED; vertical-align: middle; }
.issue-table tr { transition: background 0.15s; }
.issue-table tr:hover { background: #F8F9FA; cursor: pointer; }
.issue-table tr.active { background: #E8F0FE; }
.issue-table .preview-img { height: 28px; width: auto; max-width: 140px; object-fit: contain; border: 1px solid #DADCE0; border-radius: 4px; background: #F8F9FA; cursor: zoom-in; display: block; }

.tag { display: inline-flex; align-items: center; justify-content: center; font-size: 11px; padding: 4px 8px; border-radius: 12px; font-weight: 600; }
.tag-P0 { background: #FCE8E6; color: #C5221F; }
.tag-P1 { background: #FEF7E0; color: #B06000; }
.tag-P2 { background: #E8F0FE; color: #1A73E8; }

/* ===== 数据看板 & 板块汇总视图 (Grid/Cards) ===== */
.dashboard-wrap { padding: 24px; overflow-y: auto; flex: 1; }
.card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 8px; padding: 20px; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.stat-card .val { font-size: 36px; font-weight: 400; font-family: 'Google Sans', sans-serif; }
.stat-card .lbl { font-size: 13px; color: #5F6368; margin-top: 8px; font-weight: 500; }

.group-table { width: 100%; border-collapse: separate; border-spacing: 0; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.1); }
.group-table th { background: #F8F9FA; padding: 12px 16px; font-size: 12px; font-weight: 500; color: #5F6368; border-bottom: 1px solid #DADCE0; text-align: left; }
.group-table td { padding: 12px 16px; font-size: 13px; color: #3C4043; border-bottom: 1px solid #E8EAED; vertical-align: middle; }
.group-table tr:last-child td { border-bottom: none; }
.group-table .page-name { font-weight: 500; color: #1A73E8; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.group-table .page-name:hover { text-decoration: underline; }
.group-table .thumb-box { width: 120px; height: 60px; background: #F8F9FA; border: 1px solid #DADCE0; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: zoom-in; position: relative; }
.group-table .thumb-box img { width: 100%; height: 100%; object-fit: contain; }
.group-table .thumb-box .empty { font-size: 11px; color: #9AA0A6; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(32,33,36,0.9); cursor: zoom-out; backdrop-filter: blur(5px); }
.modal-overlay.open { display: flex; align-items: center; justify-content: center; }
.modal-overlay img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px; box-shadow: 0 12px 24px rgba(0,0,0,0.5); background: #fff; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #DADCE0; border-radius: 4px; border: 2px solid #fff; }
::-webkit-scrollbar-thumb:hover { background: #BDC1C6; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="tabbar">
    <div class="tabbar-header">
      <h3>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#1A73E8"/><path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke="#1A73E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        VisionGuard <span>Team</span>
      </h3>
    </div>
    <div class="tabbar-actions">
      <button class="btn-add-group" onclick="addTab('新测试模块',{isGroup:true})">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> 新建走查模块
      </button>
    </div>
    
    <div class="tab-list" id="tabList"></div>

    <div class="cloud-panel">
        <div class="cloud-header">
            <span id="cloudStatusText" class="cloud-status">☁️ 初始化...</span>
        </div>
        <div class="cloud-btns">
            <button onclick="manualCloudPull()" class="cloud-btn btn-pull">强制拉取</button>
            <button onclick="manualCloudPush()" class="cloud-btn btn-push">立即同步</button>
        </div>
    </div>
  </div>
  <div class="main" id="mainArea"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"><img id="modalImg"></div>

<script>
// ====================================================================
// VisionGuard Detection Engine v9 — 底层核心算法 (不可修改)
// ====================================================================

<script>
// ===== 状态管理与初始化 =====
let tabIdCounter = 1;
let activeTabId = null;
const tabs = new Map();
const collapsedGroups = new Set(); 
let devPool = []; 

function addTab(name, opts) {
  const id = 'tab_' + (tabIdCounter++);
  const isGroup = opts && opts.isGroup;
  tabs.set(id, { id, name: name || (isGroup ? '新板块 ' + (tabIdCounter-1) : '新页面 ' + (tabIdCounter-1)), isGroup: !!isGroup, children: (opts && opts.children) || [], designImg: null, devImg: null, result: null, selectedIdx: -1, overlayOpacity: 0.5 });
  renderTabList(); activateTab(id);
}
function removeTab(id) {
  const tab = tabs.get(id); if (tabs.size <= 1 || !tab) return;
  if (tab.isGroup && tab.children.length > 0) { for (const cid of tab.children) tabs.delete(cid); }
  tabs.delete(id); if (activeTabId === id) activateTab(tabs.keys().next().value);
  renderTabList(); autoSave();
}
function renameTab(id, n) { const t=tabs.get(id); if(t){t.name=n||t.name;renderTabList();} }
function removeDesignImg(id) { const t=tabs.get(id); if(!t)return; t.designImg=null; t.result=null; renderMain(id); }
function removeDevImg(id) { const t=tabs.get(id); if(!t)return; t.devImg=null; t.result=null; renderMain(id); }
function activateTab(id) { activeTabId=id; renderTabList(); renderMain(id); }
function addChildTab(groupId) {
  const g = tabs.get(groupId); if (!g) return;
  const cid = 'tab_' + (tabIdCounter++);
  tabs.set(cid, { id: cid, name: '子页面 ' + (tabIdCounter-1), isGroup: false, children: [], designImg: null, devImg: null, result: null, selectedIdx: -1, overlayOpacity: 0.5 });
  g.children.push(cid); renderTabList(); activateTab(cid);
}

// ===== 左侧 Tab 栏渲染 =====
function renderTabList() {
  const list = document.getElementById('tabList'); list.innerHTML = '';
  const groups = [], leafTabs = []; const childrenSet = new Set();
  for (const [, t] of tabs) { if (t.isGroup) for (const cid of t.children) childrenSet.add(cid); }
  for (const [, tab] of tabs) { if (tab.isGroup) groups.push(tab); else if (!childrenSet.has(tab.id)) leafTabs.push(tab); }
  
  const dataPanelIdx = groups.findIndex(g => g.name === '数据看板');
  if (dataPanelIdx > 0) { const [dp] = groups.splice(dataPanelIdx, 1); groups.unshift(dp); }
  
  for (const g of groups) {
    const isCollapsed = collapsedGroups.has(g.id);
    list.appendChild(createTabItem(g, true, isCollapsed));
    
    if (g.name !== '数据看板') {
      const childWrap = document.createElement('div'); childWrap.className = 'sub-page-wrap';
      if (isCollapsed) childWrap.style.display = 'none';
      for (const cid of g.children) { const ct = tabs.get(cid); if (ct) childWrap.appendChild(createTabItem(ct, false)); }
      
      const addBtn = document.createElement('div');
      addBtn.style.cssText = 'padding:8px 16px; font-size:13px; color:#1A73E8; cursor:pointer; font-weight:500; font-family:"Google Sans",sans-serif; margin-left:12px; border-radius:16px; transition:0.2s; display:inline-block;';
      addBtn.textContent = '+ 新增子页面'; 
      addBtn.onclick = e => { e.stopPropagation(); addChildTab(g.id); };
      addBtn.onmouseenter = () => addBtn.style.background = '#E8F0FE'; 
      addBtn.onmouseleave = () => addBtn.style.background = 'transparent';
      childWrap.appendChild(addBtn);
      list.appendChild(childWrap);
    }
  }
  for (const t of leafTabs) { list.appendChild(createTabItem(t, false)); }
}

function createTabItem(tab, isGroup, isCollapsed) {
  const el = document.createElement('div'); el.className = 'tab-item' + (tab.id === activeTabId ? ' active' : '');
  if (isGroup) {
    const arrow = isCollapsed ? '▶' : '▼';
    el.innerHTML = `<span class="collapse-arrow" onclick="event.stopPropagation();toggleCollapse('${tab.id}')" style="width:16px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#5F6368;cursor:pointer;">${arrow}</span><span class="tab-icon">${tab.name==='数据看板'?'📊':'📁'}</span><span class="tab-name">${tab.name}</span><span class="tab-actions">${tab.name!=='数据看板'?`<button onclick="event.stopPropagation();startRename('${tab.id}',this.parentElement.parentElement.querySelector('.tab-name'))" title="重命名">✏️</button>`:''}${tabs.size>1 && tab.name!=='数据看板'?`<button class="del-btn" onclick="event.stopPropagation();removeTab('${tab.id}')" title="删除">✕</button>`:''}</span>`;
    el.onclick = () => activateTab(tab.id); return el;
  }
  
  let innerIconHtml = tab.designImg ? `<span class="tab-icon" style="width:24px;height:24px;border-radius:4px;overflow:hidden;border:1px solid #DADCE0;"><img src="${tab.designImg}" style="width:100%;height:100%;object-fit:cover;"></span>` : `<span class="tab-icon">📄</span>`;
  let badgeHtml = (tab.designImg && tab.devImg) ? `<span style="font-size:10px;padding:2px 6px;border-radius:12px;background:#E6F4EA;color:#137333;">已传</span>` : `<span style="font-size:10px;padding:2px 6px;border-radius:12px;background:#FCE8E6;color:#C5221F;">未传</span>`;
  el.innerHTML = `${innerIconHtml}<span class="tab-name">${tab.name}</span>${badgeHtml}<span class="tab-actions"><button onclick="event.stopPropagation();startRename('${tab.id}',this.parentElement.parentElement.querySelector('.tab-name'))">✏️</button><button class="del-btn" onclick="event.stopPropagation();removeTab('${tab.id}')">✕</button></span>`;
  el.onclick = () => activateTab(tab.id); return el;
}

function toggleCollapse(groupId) { if (collapsedGroups.has(groupId)) collapsedGroups.delete(groupId); else collapsedGroups.add(groupId); renderTabList(); }
function startRename(id, nameEl) {
  const tab = tabs.get(id); if (!tab || !nameEl) return;
  const input = document.createElement('input'); input.className = 'inline-edit'; input.value = tab.name;
  input.onblur = () => { renameTab(id,input.value); }; input.onkeydown = e => { if(e.key==='Enter')input.blur(); if(e.key==='Escape'){input.value=tab.name;input.blur();} };
  nameEl.replaceWith(input); input.focus(); input.select();
}
function openModal(src) { document.getElementById('modalImg').src = src; document.getElementById('modalOverlay').classList.add('open'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

// ===== 路由：渲染主内容区 =====
function renderMain(id) {
  const main = document.getElementById('mainArea'); const tab = tabs.get(id); if (!tab) return;
  
  if (tab.isGroup && tab.name === '数据看板') { renderDashboard(tab); return; }
  if (tab.isGroup) { renderGroupMain(tab); return; }
  
  const hasResult = !!tab.result;
  const dCellHtml = tab.designImg ? `<span class="cell-label">🎨 设计稿</span><button onclick="event.stopPropagation();removeDesignImg('${id}')" style="position:absolute;top:10px;right:45px;z-index:5;width:28px;height:28px;border:none;border-radius:50%;background:#FFFFFF;color:#5F6368;font-size:14px;cursor:pointer;box-shadow:0 1px 2px rgba(60,64,67,0.3);">✕</button><img class="cell-img" src="${tab.designImg}" id="dImg_${id}" onclick="event.stopPropagation();openModal('${tab.designImg}')"><span class="cell-enlarge" onclick="event.stopPropagation();openModal('${tab.designImg}')">🔍</span>` : makeDropZone(id,'design','🎨','点击或拖拽上传设计稿');

function renderDevDashboardStats() {
  const el = document.getElementById('devStatsSection'); if (!el) return;
  const devMap = {};
  for (const [, t] of tabs) {
    if (t.isGroup || !t.developer || !t.result) continue;
    const dev = t.developer;
    const issues = t.result.issues || [];
    const p0c = issues.filter(i => i.priority === 'P0').length;
    const p1c = issues.filter(i => i.priority === 'P1').length;
    const score = Math.round(Math.max(0, 100 - issues.length * 5 - p0c * 10 - p1c * 5));
    if (!devMap[dev]) devMap[dev] = { name: dev, items: [], totalIssues: 0, totalP0: 0, totalP1: 0, scores: [] };
    devMap[dev].items.push({ tabName: t.name, score, issues: issues.length, p0: p0c, p1: p1c });
    devMap[dev].totalIssues += issues.length; devMap[dev].totalP0 += p0c; devMap[dev].totalP1 += p1c; devMap[dev].scores.push(score);
  }
  const list = Object.values(devMap);
  if (!list.length) { el.innerHTML = '<div style="color:#80868B;font-size:13px;padding:24px;text-align:center;">暂无责任人统计数据，请在走查页面指定责任人。</div>'; return; }
  for (const d of list) d.avgScore = Math.round(d.scores.reduce((a,b)=>a+b,0)/d.scores.length); list.sort((a,b) => b.avgScore - a.avgScore);

        <td style="color:#B06000;">${d.totalP1}</td>
        <td>${d.totalIssues}</td>

  }
  html += `</tbody></table>`;
  el.innerHTML = html;
}

// ===== 🚀 核心卡片/文字精细化纠偏走查逻辑 =====
async function runDetect(id) {
  const tab = tabs.get(id); if (!tab || !tab.designImg || !tab.devImg) return;
  tab.result = null; tab.selectedIdx = -1; renderMain(id);
  const s = document.querySelector(`#ub_${id} .status`); if (s) s.textContent = '⏳ 小龙虾 AI 走查比对中…';
  try {
    let rawResult = await window.vgDetect(tab.designImg, tab.devImg);
    if (rawResult && rawResult.issues) {
      let wrappedIssues = rawResult.issues.map(is => ({ ...is, box: { x: is.x, y: is.y, w: is.w, h: is.h } }));
      let refinedIssues = applyStructuralCorrection(wrappedIssues);
      rawResult.issues = refinedIssues.map(is => ({ ...is, x: is.box.x, y: is.box.y, w: is.box.w, h: is.box.h }));
      rawResult.issues.forEach((is, i) => is.regionIndex = i + 1);
    }
    tab.result = rawResult; renderMain(id); renderTabList(); autoSave();
    if (s) s.textContent = `✅ 检测完成，共发现 ${rawResult.issues.length} 个偏差`;
  } catch(e) { if (s) s.textContent = '❌ '+e.message; console.error(e); }
}

function applyStructuralCorrection(issues) {
  let clusters = []; const MERGE_RADIUS = 40;
  issues.forEach(issue => {
    let merged = false;
    for (let cluster of clusters) {
      if (!(issue.box.x > cluster.box.x + cluster.box.w + MERGE_RADIUS || issue.box.x + issue.box.w + MERGE_RADIUS < cluster.box.x || issue.box.y > cluster.box.y + cluster.box.h + MERGE_RADIUS || issue.box.y + issue.box.h + MERGE_RADIUS < cluster.box.y)) {
        cluster.box = { x: Math.min(cluster.box.x, issue.box.x), y: Math.min(cluster.box.y, issue.box.y), w: Math.max(cluster.box.x + cluster.box.w, issue.box.x + issue.box.w) - Math.min(cluster.box.x, issue.box.x), h: Math.max(cluster.box.y + cluster.box.h, issue.box.y + issue.box.h) - Math.min(cluster.box.y, issue.box.y) };
        cluster.rawIssues.push(issue); merged = true; break;
      }
    }
    if (!merged) { clusters.push({ box: issue.box, rawIssues: [issue] }); }
  });

  let refined = [];
  clusters.forEach(cluster => {
    let box = cluster.box; let mainIssue = cluster.rawIssues.sort((a,b) => {
        const ra = a.priority === 'P0' ? 0 : a.priority === 'P1' ? 1 : 2;
        const rb = b.priority === 'P0' ? 0 : b.priority === 'P1' ? 1 : 2;
        return ra - rb;
    })[0]; 
    let area = box.w * box.h;
    let category = mainIssue.category; let description = mainIssue.description || mainIssue.desc || ''; let detail = mainIssue.detail || ''; let priority = mainIssue.priority || 'P1';

    const isLargeArea = area > 8000; const isSquareish = (Math.max(box.w, box.h) / Math.min(box.w, box.h)) < 1.8;
    const hasFontError = cluster.rawIssues.some(i => i.category === 'font' || i.category === 'text' || (i.desc && i.desc.includes('文字')));
    const isSmallText = area < 3500;

    if (isLargeArea) {
      if (isSquareish) { category = 'image'; description = '插画大图异常'; } else { category = 'container'; description = '卡片/容器差异'; }
      const hasColorError = cluster.rawIssues.some(i => i.category === 'color');
      if (hasColorError) { category = 'position'; description = '整体位置偏移'; detail = '大卡片或插画发生整体位移，导致原位置比对失效'; priority = 'P0'; }
    } else if (hasFontError || (isSmallText && mainIssue.category === 'color')) {
       category = '文字问题';
       if (mainIssue.category === 'color' || cluster.rawIssues.some(i => i.category === 'color')) { description = '颜色差异'; detail = `文字颜色或对比度发生变化`; priority = 'P1'; }
       else if (mainIssue.category === 'size' || cluster.rawIssues.some(i => i.category === 'size')) { description = '字号差异'; detail = `字号大小或粗细发生变化`; priority = 'P1'; }
       else { description = '排版差异'; detail = `文字对齐、行距或边距出现偏移`; priority = 'P2'; }
    }
    refined.push({ ...mainIssue, box: box, category: category, description: description, detail: detail, priority: priority });
  });
  return refined;
}

// ===== 缺陷列表渲染 =====
function sortByPriority(issues) { 
    const prioRank = { P0: 0, P1: 1, P2: 2, P3: 3 }; 
    return [...issues].sort((a, b) => {
        const ra = prioRank[a.priority] !== undefined ? prioRank[a.priority] : 99;
        const rb = prioRank[b.priority] !== undefined ? prioRank[b.priority] : 99;
        return ra - rb;
    }); 
}

function renderIssueTable(id, tab) {
  const r = tab.result; if (!r) return;
  const rawIssues = r.issues || []; const cr = r.cropUrls || [];
  const issues = sortByPriority(rawIssues); const prioRank = { P0: 0, P1: 1, P2: 2, P3: 3 };
  const idxMap = rawIssues.map((iss,i)=>i); 
  idxMap.sort((a,b) => {
        const ra = prioRank[rawIssues[a].priority] !== undefined ? prioRank[rawIssues[a].priority] : 99;
        const rb = prioRank[rawIssues[b].priority] !== undefined ? prioRank[rawIssues[b].priority] : 99;
        return ra - rb;
  });
  const sortedCr = idxMap.map(i=>cr[i]);

  const h = document.getElementById('ih_'+id);
  if (h) { const p0=rawIssues.filter(x=>x.priority==='P0').length; const p1=rawIssues.filter(x=>x.priority==='P1').length; h.innerHTML = `<h3>📋 缺陷报告</h3><span class="stats">共发现 ${rawIssues.length} 个缺陷 ( P0: ${p0} , P1: ${p1} )</span>`; }
  const wrap = document.getElementById('ilw_'+id); if (!wrap) return;
  if (issues.length === 0) { wrap.innerHTML = '<div class="no-issues">🎉 完美还原！测试通过，没有发现视觉缺陷。</div>'; return; }

  let html = `<table class="issue-table"><thead><tr><th class="id-col">#</th><th class="prio-col">级别</th><th class="type-col">类型</th><th>描述</th><th>预览图</th><th>技术详情</th></tr></thead><tbody>`;
  const typeMap = { font:'字体', position:'位置', size:'尺寸', color:'颜色', image:'图片', container:'容器' };
  
  issues.forEach((iss,i) => {
    const src = sortedCr[i] || ''; 
    const previewHtml = src ? `<img class="preview-img" src="${src}" onclick="event.stopPropagation();openModal('${src}')">` : '-';
    let subTypeStyle = '';
    if (iss.category === '文字问题') {
      if (iss.description === '颜色差异') subTypeStyle = 'color: #D93025; font-weight: 600;';
      else if (iss.description === '字号差异') subTypeStyle = 'color: #F29900; font-weight: 600;';
      else if (iss.description === '排版差异') subTypeStyle = 'color: #1A73E8; font-weight: 600;';
    }

    html += `<tr class="${i===tab.selectedIdx?'active':''}" data-idx="${idxMap[i]}" onclick="selectIssue('${id}',${idxMap[i]})"><td class="id-col">${i+1}</td><td class="prio-col"><span class="tag tag-${iss.priority||'P2'}">${iss.priority||'P2'}</span></td><td class="type-col">${typeMap[iss.category]||iss.category}</td><td style="${subTypeStyle}">${iss.description || ''}</td><td style="padding: 6px 16px;">${previewHtml}</td><td style="color:#5F6368;font-size:12px;">${iss.detail||''}</td></tr>`;
  });
  html += '</tbody></table>'; wrap.innerHTML = html;
  if (issues.length > 0 && tab.selectedIdx < 0) selectIssue(id, idxMap[0]); else if (tab.selectedIdx >= 0) drawMarkers(id, tab);
}

function selectIssue(id, idx) {
  const tab = tabs.get(id); if (!tab||!tab.result||!tab.result.issues[idx]) return;
  tab.selectedIdx = idx; document.querySelectorAll(`#ilw_${id} tr`).forEach(el=>el.classList.remove('active'));
  const row = document.querySelector(`#ilw_${id} tr[data-idx="${idx}"]`); if (row) row.classList.add('active'); drawMarkers(id, tab);
}

function drawMarkers(id, tab) {
  const r = tab.result; const idx = tab.selectedIdx; if (idx < 0 || !r || !r.issues[idx]) return; const iss = r.issues[idx];
  document.querySelectorAll(`#dCell_${id} .marker, #vCell_${id} .marker`).forEach(el=>el.remove());
  const addMarker = (cellId, imgId, ox, oy) => {
    const cell = document.getElementById(cellId); const img = document.getElementById(imgId); if (!cell || !img) return;
    const tryMark = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight; const cw = cell.offsetWidth, ch = cell.offsetHeight; if (!iw || !ih || !cw || !ch) { setTimeout(tryMark, 100); return; }
      const scale = Math.min(cw / iw, ch / ih); const dispW = iw * scale, dispH = ih * scale; const offsetX = (cw - dispW) / 2, offsetY = (ch - dispH) / 2;
      cell.querySelectorAll('.marker').forEach(el=>el.remove());
      const m = document.createElement('div'); m.className = 'marker'; m.style.cssText = `position:absolute;left:${offsetX+(iss.x+ox)*scale}px;top:${offsetY+(iss.y+oy)*scale}px;width:${Math.max(iss.w*scale,2)}px;height:${Math.max(iss.h*scale,2)}px;border:2px solid #EA4335;border-radius:4px;pointer-events:none;z-index:2;box-shadow:0 0 0 1px rgba(255,255,255,0.8);`; cell.appendChild(m);
    }; tryMark();
  };
  addMarker('dCell_'+id, 'dImg_'+id, 0, 0); addMarker('vCell_'+id, 'vImg_'+id, r.align ? -r.align.dx : 0, r.align ? -r.align.dy : 0);
}

document.addEventListener('keydown', e => {
  if (!activeTabId) return; const tab = tabs.get(activeTabId); if (!tab||!tab.result||!tab.result.issues.length) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { const d = e.key==='ArrowUp' ? -1 : 1; const n = tab.selectedIdx + d; if (n>=0 && n<tab.result.issues.length) { selectIssue(activeTabId, n); const row = document.querySelector(`#ilw_${activeTabId} tr[data-idx="${n}"]`); if (row) row.scrollIntoView({behavior:'smooth', block:'nearest'}); } e.preventDefault(); }
});

// ===== 本地存储管理 =====
const DB_NAME = 'VisionGuardDB'; const DB_VERSION = 4; const STORE_NAME = 'tabs'; const CONFIG_KEY = 'appConfig';
function openDB() { return new Promise((resolve, reject) => { const req = indexedDB.open(DB_NAME, DB_VERSION); req.onupgradeneeded = e => { const db = e.target.result; if (e.oldVersion > 0 && e.oldVersion < DB_VERSION) { if (db.objectStoreNames.contains(STORE_NAME)) db.deleteObjectStore(STORE_NAME); } if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id' }); }; req.onsuccess = e => resolve(e.target.result); req.onerror = e => reject(e.target.error); }); }
async function loadDevPool() { try { const db = await openDB(); const tx = db.transaction(STORE_NAME, 'readonly'); const store = tx.objectStore(STORE_NAME); const cfg = await new Promise((resolve, reject) => { const req = store.get(CONFIG_KEY); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); if (cfg && cfg.devPool) devPool = cfg.devPool; } catch(e) {} }
async function saveDevPool() { try { const db = await openDB(); const tx = db.transaction(STORE_NAME, 'readwrite'); const store = tx.objectStore(STORE_NAME); store.put({ id: CONFIG_KEY, devPool: devPool }); await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = reject; }); } catch(e) {} }
async function saveTabs() { try { const db = await openDB(); const tx = db.transaction(STORE_NAME, 'readwrite'); const store = tx.objectStore(STORE_NAME); store.clear(); for (const [, tab] of tabs) { store.put({ id: tab.id, name: tab.name, isGroup: tab.isGroup, children: tab.children, designImg: tab.designImg, devImg: tab.devImg, result: tab.result, overlayOpacity: tab.overlayOpacity, developer: tab.developer || '' }); } await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = reject; }); } catch(e) {} }
async function loadTabs() { try { const db = await openDB(); const tx = db.transaction(STORE_NAME, 'readonly'); const store = tx.objectStore(STORE_NAME); const all = await new Promise((resolve, reject) => { const req = store.getAll(); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); if (!all || all.length === 0) return false; tabs.clear(); let maxId = 0; for (const rec of all) { tabs.set(rec.id, rec); const num = parseInt(rec.id.replace('tab_', ''), 10); if (num > maxId) maxId = num; } tabIdCounter = maxId + 1; return true; } catch(e) { return false; } }

function autoSave() { setTimeout(saveTabs, 100); autoCloudify(); }

// ===== Cloudinary 云端协作同步 =====
const CLOUD_NAME = 'dxm3bwnzi';
const API_KEY = '713313811327755';
const API_SECRET = 'QIBVvLSSePJW5-1UVYECknvBLBQ';
const DATA_NAME = 'vg527c';

let pendingCloudSync = null;
function autoCloudify() {
  if (pendingCloudSync) clearTimeout(pendingCloudSync);
  pendingCloudSync = setTimeout(manualCloudPush, 3500); // 防抖自动上传
}

function updateCloudUI(text, statusType) {
  const statusEl = document.getElementById('cloudStatusText');
  if (statusEl) {
      statusEl.innerHTML = text;
      statusEl.className = 'cloud-status ' + statusType;
  }
}

async function manualCloudPush() {
  updateCloudUI('☁️ 正在推送...', 'syncing');
  try {
    const data = {};
    for (const [id, tab] of tabs) {
      data[id] = { id: id, name: tab.name, isGroup: tab.isGroup, children: tab.children, designImg: tab.designImg, devImg: tab.devImg, result: tab.result, developer: tab.developer || '' };
    }
    const json = JSON.stringify(data);
    const timestamp = Math.floor(Date.now() / 1000);
    const signStr = 'public_id=' + DATA_NAME + '&timestamp=' + timestamp + API_SECRET;
    const sig = await sha1Hex(signStr);
    
    const formData = new FormData();
    formData.append('file', new Blob([json], { type: 'application/json' }), 'data.json');
    formData.append('api_key', API_KEY);
    formData.append('timestamp', timestamp + '');
    formData.append('signature', sig);
    formData.append('public_id', DATA_NAME);
    formData.append('resource_type', 'raw');
    
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/raw/upload`, { method: 'POST', body: formData });
    if (!res.ok) { updateCloudUI('☁️ 推送失败', 'err'); }
    else { updateCloudUI('✅ 云端已同步', 'ok'); }
  } catch(e) {
    updateCloudUI('☁️ 网络异常', 'err');
  }
}

async function cloudifyLoad() {
  try {
    const url = `https://res.cloudinary.com/${CLOUD_NAME}/raw/upload/${DATA_NAME}.json?_t=${Date.now()}`;
    const res = await fetch(url);
    if (res.status === 404) {
        console.log("云端尚无数据，准备首次初始化...");
        return false;
    }
    if (!res.ok) return false;
    
    const remote = await res.json();
    if (!remote || typeof remote !== 'object' || Object.keys(remote).length === 0) return false;
    
    tabs.clear();
    let maxId = 0;
    for (const [id, rec] of Object.entries(remote)) {
      if (!rec.id) rec.id = id;
      tabs.set(id, rec);
      const num = parseInt(id.replace('tab_', ''), 10);
      if (num > maxId) maxId = num;
    }
    tabIdCounter = maxId + 1;
    return true;
  } catch(e) { return false; }
}

async function manualCloudPull() {
  updateCloudUI('☁️ 正在拉取...', 'syncing');
  const restored = await cloudifyLoad();
  if (restored) {
    let defaultKey = tabs.keys().next().value;
    for (const [id, tab] of tabs) { if (tab.isGroup && tab.name !== '数据看板') { defaultKey = id; break; } }
    if (defaultKey) { activeTabId = defaultKey; renderTabList(); renderMain(defaultKey); }
    updateCloudUI('✅ 拉取成功', 'ok');
  } else {
    updateCloudUI('☁️ 无云端数据', 'err');
  }
}

function sha1Hex(str) {
  return crypto.subtle.digest('SHA-1', new TextEncoder().encode(str)).then(buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join(''));
}
